</head>
<body>
  <!-- Keep this blank. Add custom page content here later if needed. -->
 <main data-wsc-page-content class="mark-page">
  <style>
    .mark-page {
      --mark-primary: var(--wsc-primary, #2563eb);
      --mark-primary-dark: var(--wsc-primary-dark, #1d4ed8);
      --mark-bg: var(--wsc-bg, #f6f9ff);
      --mark-card: var(--wsc-surface, #ffffff);
      --mark-card-soft: var(--wsc-surface-soft, #f1f5ff);
      --mark-text: var(--wsc-text, #111827);
      --mark-muted: var(--wsc-muted, #6b7280);
      --mark-border: var(--wsc-border, #dbe4f0);
      --mark-success: var(--wsc-success, #16a34a);
      --mark-success-bg: var(--success-bg, #ecfdf3);
      --mark-danger: var(--wsc-danger, #dc2626);
      --mark-danger-bg: var(--danger-bg, #fff1f2);
      --mark-warning: var(--warning, #b45309);
      --mark-warning-bg: var(--warning-bg, #fff7ed);
      --mark-font: var(--wsc-font-bn, "Noto Sans Bengali", system-ui, sans-serif);
      --mark-radius-sm: var(--wsc-radius-sm, 8px);
      --mark-radius-md: var(--wsc-radius-md, 14px);
      --mark-radius-lg: var(--wsc-radius-lg, 22px);
      --mark-radius-pill: var(--wsc-radius-pill, 999px);
      --mark-shadow: var(--wsc-shadow, 0 14px 40px rgba(15, 23, 42, 0.08));
      --mark-transition: var(--wsc-transition, 180ms ease);

      width: 100%;
      min-height: 100%;
      background: var(--mark-bg);
      color: var(--mark-text);
      font-family: var(--mark-font);
      font-size: var(--wsc-text-base, 16px);
      padding: 24px;
      box-sizing: border-box;
    }

    .mark-app-card {
      width: 100%;
      max-width: 560px;
      background: var(--mark-card);
      border: 1px solid var(--mark-border);
      border-radius: var(--mark-radius-lg);
      padding: 32px;
      box-shadow: var(--mark-shadow);
      margin: 0 auto;
      box-sizing: border-box;
    }

    .mark-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .mark-header h1 {
      margin: 0 0 8px;
      font-size: var(--wsc-text-xl, 28px);
      line-height: 1.2;
      color: var(--mark-primary);
      font-weight: 800;
      letter-spacing: -0.4px;
    }

    .mark-header p {
      margin: 0;
      color: var(--mark-muted);
      font-size: var(--wsc-text-sm, 14px);
      line-height: 1.5;
    }

    .mark-form-group {
      margin-bottom: 18px;
    }

    .mark-label {
      display: block;
      margin-bottom: 8px;
      font-size: var(--wsc-text-sm, 14px);
      font-weight: 700;
      color: var(--mark-text);
    }

    .mark-input {
      width: 100%;
      height: 48px;
      border: 1px solid var(--mark-border);
      border-radius: var(--mark-radius-md);
      padding: 0 14px;
      font-size: var(--wsc-text-base, 16px);
      color: var(--mark-text);
      outline: none;
      background: var(--mark-card);
      transition: border-color var(--mark-transition), box-shadow var(--mark-transition), background var(--mark-transition);
      font-family: var(--mark-font);
      box-sizing: border-box;
      caret-color: var(--mark-primary);
    }

    .mark-input::placeholder {
      color: var(--mark-muted);
      opacity: 0.85;
    }

    .mark-input:focus {
      border-color: var(--mark-primary);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--mark-primary) 14%, transparent);
    }

    .mark-input:-webkit-autofill,
    .mark-input:-webkit-autofill:hover,
    .mark-input:-webkit-autofill:focus {
      -webkit-text-fill-color: var(--mark-text) !important;
      caret-color: var(--mark-primary);
      box-shadow: 0 0 0 1000px var(--mark-card) inset !important;
      transition: background-color 9999s ease-in-out 0s;
    }

    .mark-custom-select {
      position: relative;
      width: 100%;
    }

    .mark-custom-trigger {
      width: 100%;
      height: 48px;
      border: 1px solid var(--mark-border);
      border-radius: var(--mark-radius-md);
      padding: 0 14px;
      font-size: var(--wsc-text-base, 16px);
      color: var(--mark-text);
      outline: none;
      background: var(--mark-card);
      transition: border-color var(--mark-transition), box-shadow var(--mark-transition), background var(--mark-transition);
      font-family: var(--mark-font);
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-sizing: border-box;
    }

    .mark-custom-trigger:hover,
    .mark-custom-select.open .mark-custom-trigger {
      border-color: var(--mark-primary);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--mark-primary) 12%, transparent);
    }

    .mark-custom-arrow {
      width: 28px;
      height: 28px;
      border-radius: var(--mark-radius-pill);
      background: var(--mark-card-soft);
      color: var(--mark-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: var(--wsc-text-sm, 14px);
      flex: 0 0 auto;
      transition: transform var(--mark-transition);
    }

    .mark-custom-select.open .mark-custom-arrow {
      transform: rotate(180deg);
    }

    .mark-custom-list {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      z-index: 50;
      display: none;
      padding: 8px;
      background: var(--mark-card);
      border: 1px solid var(--mark-border);
      border-radius: var(--mark-radius-md);
      box-shadow: var(--mark-shadow);
    }

    .mark-custom-select.open .mark-custom-list {
      display: block;
    }

    .mark-custom-option {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--mark-text);
      padding: 12px 14px;
      border-radius: var(--mark-radius-sm);
      font-size: var(--wsc-text-sm, 14px);
      font-family: var(--mark-font);
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      transition: background var(--mark-transition), color var(--mark-transition);
    }

    .mark-custom-option:hover,
    .mark-custom-option.active {
      background: var(--mark-card-soft);
      color: var(--mark-primary);
    }

    .mark-custom-option.active::after {
      content: "✓";
      float: right;
      color: var(--mark-success);
    }

    .mark-btn {
      width: 100%;
      height: 50px;
      border: none;
      border-radius: var(--mark-radius-md);
      background: var(--mark-primary);
      color: #ffffff;
      font-size: var(--wsc-text-base, 16px);
      font-weight: 700;
      cursor: pointer;
      transition: background var(--mark-transition), transform var(--mark-transition), opacity var(--mark-transition);
      margin-top: 6px;
      font-family: var(--mark-font);
    }

    .mark-btn:hover {
      background: var(--mark-primary-dark);
      transform: translateY(-1px);
    }

    .mark-btn:disabled {
      background: var(--mark-muted);
      cursor: not-allowed;
      transform: none;
      opacity: 0.75;
    }

    .mark-status-box {
      display: none;
      margin-top: 20px;
      padding: 16px;
      border-radius: var(--mark-radius-md);
      font-size: var(--wsc-text-sm, 14px);
      line-height: 1.5;
      border: 1px solid var(--mark-border);
    }

    .mark-loading {
      background: var(--mark-card-soft);
      color: var(--mark-primary);
      border-color: color-mix(in srgb, var(--mark-primary) 30%, var(--mark-border));
    }

    .mark-error {
      background: var(--mark-danger-bg);
      color: var(--mark-danger);
      border-color: color-mix(in srgb, var(--mark-danger) 28%, var(--mark-border));
    }

    .mark-success {
      background: var(--mark-success-bg);
      color: var(--mark-success);
      border-color: color-mix(in srgb, var(--mark-success) 30%, var(--mark-border));
    }

    .mark-success h3 {
      margin: 0 0 10px;
      color: var(--mark-success);
      font-size: var(--wsc-text-md, 18px);
      font-weight: 800;
    }

    .mark-result-info {
      margin-bottom: 14px;
      color: var(--mark-text);
    }

    .mark-link-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .mark-link-buttons a {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 44px;
      padding: 10px 12px;
      text-decoration: none;
      border-radius: var(--mark-radius-md);
      background: var(--mark-success);
      color: #ffffff;
      font-size: var(--wsc-text-sm, 14px);
      font-weight: 700;
      text-align: center;
      transition: transform var(--mark-transition), opacity var(--mark-transition);
    }

    .mark-link-buttons a:hover {
      transform: translateY(-1px);
      opacity: 0.92;
    }

    .mark-link-buttons a.mark-secondary {
      background: var(--mark-text);
      color: var(--mark-card);
    }

    .mark-note {
      margin-top: 18px;
      text-align: center;
      font-size: var(--wsc-text-xs, 12px);
      color: var(--mark-muted);
      line-height: 1.5;
    }

    @media (max-width: 520px) {
      .mark-page {
        padding: 14px;
      }

      .mark-app-card {
        padding: 24px 18px;
      }

      .mark-header h1 {
        font-size: var(--wsc-text-lg, 22px);
      }

      .mark-link-buttons {
        grid-template-columns: 1fr;
      }
    }
  </style>

  <section class="mark-app-card">
    <div class="mark-header">
      <h1>Marksheet</h1>
      <p>Class select kore exam name diye PDF generate korun.</p>
    </div>

    <form id="marksheetForm">
      <div class="mark-form-group">
        <label class="mark-label" for="className">Select Class</label>
        <input type="hidden" id="className" value="">
        <div class="mark-custom-select" id="classNameDropdown">
          <button type="button" class="mark-custom-trigger" onclick="markToggleDropdown('classNameDropdown')">
            <span id="classNameText">Choose Class</span>
            <span class="mark-custom-arrow">⌄</span>
          </button>
          <div class="mark-custom-list">
            <button type="button" class="mark-custom-option" onclick="markSelectDropdown('classNameDropdown', 'className', 'classNameText', 'play', 'Play', this)">Play</button>
            <button type="button" class="mark-custom-option" onclick="markSelectDropdown('classNameDropdown', 'className', 'classNameText', 'nursery', 'Nursery', this)">Nursery</button>
            <button type="button" class="mark-custom-option" onclick="markSelectDropdown('classNameDropdown', 'className', 'classNameText', 'kg', 'KG', this)">KG</button>
            <button type="button" class="mark-custom-option" onclick="markSelectDropdown('classNameDropdown', 'className', 'classNameText', '1', 'Class 1', this)">Class 1</button>
            <button type="button" class="mark-custom-option" onclick="markSelectDropdown('classNameDropdown', 'className', 'classNameText', '2', 'Class 2', this)">Class 2</button>
            <button type="button" class="mark-custom-option" onclick="markSelectDropdown('classNameDropdown', 'className', 'classNameText', '3', 'Class 3', this)">Class 3</button>
            <button type="button" class="mark-custom-option" onclick="markSelectDropdown('classNameDropdown', 'className', 'classNameText', '4', 'Class 4', this)">Class 4</button>
            <button type="button" class="mark-custom-option" onclick="markSelectDropdown('classNameDropdown', 'className', 'classNameText', '5', 'Class 5', this)">Class 5</button>
          </div>
        </div>
      </div>

      <div class="mark-form-group">
        <label class="mark-label" for="examName">Exam Name</label>
        <input
          type="text"
          id="examName"
          class="mark-input"
          placeholder="Example: Half Yearly Exam 2026"
          required
        />
      </div>

      <button type="submit" class="mark-btn" id="generateBtn">Generate PDF</button>
    </form>

    <div class="mark-status-box mark-loading" id="loadingBox">
      Generating PDF. অপেক্ষা করুন.
    </div>

    <div class="mark-status-box mark-error" id="errorBox"></div>

    <div class="mark-status-box mark-success" id="successBox">
      <h3>PDF Generated হয়েছে!</h3>
      <div class="mark-result-info" id="resultInfo"></div>
      <div class="mark-link-buttons">
        <a href="#" target="_blank" rel="noopener" id="viewPdfLink">View PDF</a>
        <a href="#" target="_blank" rel="noopener" id="downloadPdfLink" class="mark-secondary">Download PDF</a>
      </div>
    </div>
  </section>

  <script>
    const APPS_SCRIPT_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxsAGGAfTsQFUfuC78tyqXyuCOtOlNKPKvzUCJh6DnxU4389gBL1OHGq18Gm6LSrtZh/exec';
    const API_TOKEN = 'CHANGE_THIS_SECRET_TOKEN_12345'; // Must match the SECRET/API_TOKEN inside your Apps Script backend

    const form = document.getElementById('marksheetForm');
    const classNameInput = document.getElementById('className');
    const examNameInput = document.getElementById('examName');
    const generateBtn = document.getElementById('generateBtn');

    const loadingBox = document.getElementById('loadingBox');
    const errorBox = document.getElementById('errorBox');
    const successBox = document.getElementById('successBox');
    const resultInfo = document.getElementById('resultInfo');
    const viewPdfLink = document.getElementById('viewPdfLink');
    const downloadPdfLink = document.getElementById('downloadPdfLink');

    function markToggleDropdown(dropdownId) {
      const dropdown = document.getElementById(dropdownId);
      document.querySelectorAll('.mark-custom-select').forEach(function (item) {
        if (item.id !== dropdownId) item.classList.remove('open');
      });
      dropdown.classList.toggle('open');
    }

    function markSelectDropdown(dropdownId, inputId, textId, value, label, optionElement) {
      document.getElementById(inputId).value = value;
      document.getElementById(textId).innerText = label;

      const dropdown = document.getElementById(dropdownId);
      dropdown.querySelectorAll('.mark-custom-option').forEach(function (option) {
        option.classList.remove('active');
      });
      optionElement.classList.add('active');
      dropdown.classList.remove('open');
    }

    document.addEventListener('click', function (event) {
      if (!event.target.closest('.mark-custom-select')) {
        document.querySelectorAll('.mark-custom-select').forEach(function (item) {
          item.classList.remove('open');
        });
      }
    });

    form.addEventListener('submit', async function (event) {
      event.preventDefault();

      const className = classNameInput.value.trim();
      const examName = examNameInput.value.trim();

      if (!className || !examName) {
        showError('Please select class and enter exam name.');
        return;
      }

      if (!APPS_SCRIPT_WEB_APP_URL || APPS_SCRIPT_WEB_APP_URL.includes('PASTE_YOUR')) {
        showError('Please set your Apps Script Web App URL in APPS_SCRIPT_WEB_APP_URL.');
        return;
      }

      setLoading(true);

      try {
        const response = await callBackend({
          action: 'generatePdf',
          className: className,
          examName: examName,
          token: API_TOKEN
        });

        if (!response || !response.success) {
          throw new Error((response && response.error) || 'Failed to generate PDF.');
        }

        showSuccess(response);
      } catch (error) {
        showError(error.message || String(error));
      } finally {
        setLoading(false);
      }
    });

    /************************************************************
     * BACKEND CALL FIX
     * 1) First tries normal GET fetch for Apps Script JSON response.
     * 2) If browser blocks fetch/CORS, it falls back to JSONP.
     * 3) If backend returns JSONP text, it can also parse that safely.
     ************************************************************/
    async function callBackend(params) {
      const queryParams = Object.assign({}, params, {
        cacheBust: Date.now()
      });

      const url = APPS_SCRIPT_WEB_APP_URL + '?' + new URLSearchParams(queryParams).toString();
      let fetchError = null;

      try {
        const response = await fetch(url, {
          method: 'GET',
          cache: 'no-store',
          redirect: 'follow'
        });

        const text = await response.text();

        if (!response.ok) {
          throw new Error('Backend HTTP error: ' + response.status);
        }

        return parseBackendResponse(text);
      } catch (error) {
        fetchError = error;
      }

      try {
        return await callBackendJsonp(params);
      } catch (jsonpError) {
        throw new Error(
          'Backend response পাওয়া যায়নি। Web App URL, deployment access, token, অথবা response format check করুন. Fetch error: ' +
          (fetchError ? fetchError.message : 'none') +
          ' | JSONP error: ' +
          (jsonpError ? jsonpError.message : 'none')
        );
      }
    }

    function parseBackendResponse(text) {
      const cleanText = String(text || '').trim();

      if (!cleanText) {
        throw new Error('Backend returned empty response.');
      }

      try {
        return JSON.parse(cleanText);
      } catch (jsonError) {
        const jsonpMatch = cleanText.match(/^[a-zA-Z_$][\w$]*\(([\s\S]*)\);?$/);
        if (jsonpMatch && jsonpMatch[1]) {
          return JSON.parse(jsonpMatch[1]);
        }

        if (cleanText.toLowerCase().includes('<html') || cleanText.toLowerCase().includes('<!doctype')) {
          throw new Error('Backend returned HTML page. Apps Script Web App deployment/access is not returning JSON.');
        }

        throw new Error('Backend response is not valid JSON/JSONP.');
      }
    }

    /************************************************************
     * JSONP CALL
     * Use this fallback only if fetch is blocked by CORS.
     * Backend must return: callbackName({ success: true, ... })
     ************************************************************/
    function callBackendJsonp(params) {
      return new Promise(function (resolve, reject) {
        const callbackName = 'marksheetCallback_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
        const script = document.createElement('script');
        const timeoutMs = 120000;
        let finished = false;

        params.callback = callbackName;
        params.cacheBust = Date.now();

        const queryString = new URLSearchParams(params).toString();
        script.src = APPS_SCRIPT_WEB_APP_URL + '?' + queryString;
        script.async = true;

        const timeout = setTimeout(function () {
          cleanup();
          reject(new Error('Request timeout. Backend connected but callback/JSON response পাওয়া যায়নি.'));
        }, timeoutMs);

        window[callbackName] = function (data) {
          finished = true;
          cleanup();
          resolve(data);
        };

        script.onerror = function () {
          cleanup();
          reject(new Error('JSONP script load failed. Backend may be returning plain JSON, HTML, or deployment is not public.'));
        };

        script.onload = function () {
          setTimeout(function () {
            if (!finished && window[callbackName]) {
              cleanup();
              reject(new Error('Script loaded but JSONP callback was not called. Backend must support callback parameter or use JSON fetch response.'));
            }
          }, 0);
        };

        function cleanup() {
          clearTimeout(timeout);
          delete window[callbackName];

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }
        }

        document.body.appendChild(script);
      });
    }

    function setLoading(isLoading) {
      generateBtn.disabled = isLoading;
      generateBtn.textContent = isLoading ? 'Generating PDF...' : 'Generate PDF';

      loadingBox.style.display = isLoading ? 'block' : 'none';

      if (isLoading) {
        errorBox.style.display = 'none';
        successBox.style.display = 'none';
      }
    }

    function showError(message) {
      errorBox.textContent = message;
      errorBox.style.display = 'block';
      successBox.style.display = 'none';
    }

    function showSuccess(data) {
      resultInfo.innerHTML = `
        <strong>Exam Name:</strong> ${escapeHtml(data.examName)}<br>
        <strong>Class:</strong> ${escapeHtml(data.className)}<br>
        <strong>Total Students:</strong> ${escapeHtml(String(data.totalStudents))}<br>
        <strong>PDF File:</strong> ${escapeHtml(data.pdfFileName)}
      `;

      viewPdfLink.href = data.pdfViewUrl || '#';
      downloadPdfLink.href = data.pdfDownloadUrl || data.pdfViewUrl || '#';

      successBox.style.display = 'block';
      errorBox.style.display = 'none';
    }

    function escapeHtml(value) {
      return String(value === null || value === undefined ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</main>
