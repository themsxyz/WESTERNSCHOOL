<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbz3CFA6yHyBhKCfXATs0CmDL3J5vLTWoCZNJOWlBqCdLOcrIeKTdUS3M5o5pveHlFkUXA/exec";

const SUBJECTS = {

play:{
bn:"বাংলা",
en:"ইংরেজি",
math:"গণিত",
drawing:"অংকন"
},

nursery:{
math:"গণিত",
en:"ইংরেজি",
drawing:"অংকন",
oral_religion:"মৌখিক ধর্ম",
bn:"বাংলা"
},

kg:{
bn:"বাংলা",
en:"ইংরেজি",
spoken_en:"স্পোকেন ইংলিশ",
math:"গণিত",
bn_dictation:"বাংলা ডিক্টেশন",
gk:"সাধারণ জ্ঞান",
drawing:"অংকন",
religion:"ধর্ম"
},

1:{
bn:"বাংলা",
drawing:"অংকন",
en:"ইংরেজি",
spoken_en:"স্পোকেন ইংলিশ",
math:"গণিত",
bn_dictation:"বাংলা ডিক্টেশন",
computer:"কম্পিউটার",
gk:"সাধারণ জ্ঞান",
religion:"ধর্ম"
},

2:{
math:"গণিত",
religion:"ধর্ম",
bn:"বাংলা",
en:"ইংরেজি",
spoken_en:"স্পোকেন ইংলিশ",
gk:"সাধারণ জ্ঞান",
drawing:"অংকন",
bn_dictation:"বাংলা ডিক্টেশন",
computer:"কম্পিউটার"
},

3:{
math:"গণিত",
bn:"বাংলা",
bgs:"বাংলাদেশ ও বিশ্বপরিচয়",
gk:"সাধারণ জ্ঞান",
en1:"ইংরেজি ১ম পত্র",
en2:"ইংরেজি ২য় পত্র",
computer:"কম্পিউটার",
religion:"ধর্ম",
science:"বিজ্ঞান"
},

4:{
math:"গণিত",
bn:"বাংলা",
bgs:"বাংলাদেশ ও বিশ্বপরিচয়",
gk:"সাধারণ জ্ঞান",
en1:"ইংরেজি ১ম পত্র",
en2:"ইংরেজি ২য় পত্র",
computer:"কম্পিউটার",
religion:"ধর্ম",
science:"বিজ্ঞান"
},

5:{
math:"গণিত",
bn:"বাংলা",
bgs:"বাংলাদেশ ও বিশ্বপরিচয়",
gk:"সাধারণ জ্ঞান",
en1:"ইংরেজি ১ম পত্র",
en2:"ইংরেজি ২য় পত্র",
computer:"কম্পিউটার",
religion:"ধর্ম",
science:"বিজ্ঞান"
}

};

let typingTimer;

document
.getElementById("studentId")
.addEventListener(
"input",
function(){

clearTimeout(typingTimer);

typingTimer =
setTimeout(()=>{
loadStudent();
},250);

}
);

async function loadStudent(){

const studentId =
document.getElementById(
"studentId"
).value.trim();

if(!studentId){

document.getElementById(
"studentName"
).value = "";

document.getElementById(
"studentRoll"
).value = "";

return;

}

try{

const res =
await fetch(API_URL,{

method:"POST",

body:JSON.stringify({

action:"studentInfo",

studentId:studentId

})

});

const data =
await res.json();

if(data.success){

document.getElementById(
"studentName"
).value =
data.student.name || "";

document.getElementById(
"studentRoll"
).value =
data.student.roll || "";

}else{

document.getElementById(
"studentName"
).value = "";

document.getElementById(
"studentRoll"
).value = "";

}

}catch(err){

console.log(err);

}

}

function renderSubjects(){

const className =
document.getElementById(
"className"
).value;

const box =
document.getElementById(
"subjects"
);

box.innerHTML = "";

const subs =
SUBJECTS[className];

for(let key in subs){

box.innerHTML += `

<div class="subject">

<h3>
${subs[key]}
</h3>

<label>
Total Marks
</label>

<select id="${key}_total">

<option value="100">
100
</option>

<option value="50">
50
</option>

</select>

<label>
Obtain Marks
</label>

<input
type="number"
id="${key}_obtain">

</div>

`;

}

}

document
.getElementById(
"className"
)
.addEventListener(
"change",
renderSubjects
);

renderSubjects();

async function saveResult(){

const className =
document.getElementById(
"className"
).value;

const subjects = {};

for(let key in SUBJECTS[className]){

subjects[key] = {

total:
document.getElementById(
`${key}_total`
).value,

obtain:
document.getElementById(
`${key}_obtain`
).value

};

}

const payload = {

action:"saveResult",

studentId:
document.getElementById(
"studentId"
).value,

studentName:
document.getElementById(
"studentName"
).value,

studentRoll:
document.getElementById(
"studentRoll"
).value,

className,

examName:
document.getElementById(
"examName"
).value,

subjects

};

const res =
await fetch(API_URL,{

method:"POST",

body:JSON.stringify(payload)

});

const data =
await res.json();

alert(data.message);

}

async function showResults(){

const studentId =
document.getElementById(
"studentId"
).value.trim();

const className =
document.getElementById(
"className"
).value;

if(!studentId){

alert("Student ID দিন");

return;

}

const res =
await fetch(API_URL,{

method:"POST",

body:JSON.stringify({

action:"getStudentResults",

studentId:studentId

})

});

const data =
await res.json();

const filtered =
data.results.filter(
r => r["Class"] == className
);

let html = "";

if(filtered.length === 0){

html = `
<div class="result-empty">
No Result Found
</div>
`;

document.getElementById(
"dashboard"
).innerHTML = html;

return;

}

const student =
filtered[0];

html += `

<div class="result-dashboard">

<div class="result-student-card">

<div class="result-student-top">

<div class="result-student-info">

<h2>
${student["Student Name"]}
</h2>

<p>
Student ID :
${student["Student ID"]}
</p>

<p>
Roll :
${student["Roll"]}
</p>

<p>
Class :
${student["Class"]}
</p>

</div>

<div class="result-badge">
Academic Result Dashboard
</div>

</div>

</div>

<div class="result-exam-grid">
`;

filtered.forEach(result=>{

const statusClass =
result["Overall Status"] == "Pass"
? "result-status-pass"
: "result-status-fail";

let rows = "";

Object.keys(result).forEach(key=>{

if(key.includes(" Total")){

const sub =
key.replace(" Total","");

rows += `

<tr>

<td class="result-subject-name">
${sub}
</td>

<td>
${result[sub + " Obtain"]}
/
${result[sub + " Total"]}
</td>

<td class="result-grade">
${result[sub + " Grade"]}
</td>

<td class="${
result[sub + " Status"] ==
"ভালো"
? "result-good"
: "result-bad"
}">
${result[sub + " Status"]}
</td>

</tr>

`;

}

});

html += `

<div class="result-exam-card">

<div class="result-exam-header">

<div class="result-exam-title">
${result["Exam Name"]}
</div>

<div class="${statusClass}">
${result["Overall Status"]}
</div>

</div>

<div class="result-summary-grid">

<div class="result-summary-box">

<h4>
Overall Grade
</h4>

<p>
${result["Overall Grade"]}
</p>

</div>

<div class="result-summary-box">

<h4>
Pass Rate
</h4>

<p>
${result["Pass Rate"]}
</p>

</div>

<div class="result-summary-box">

<h4>
Exam
</h4>

<p>
${result["Exam Name"]}
</p>

</div>

</div>

<div class="result-progress-wrap">

<div class="result-progress-head">

<span>
Result Progress
</span>

<span>
${result["Pass Rate"]}
</span>

</div>

<div class="result-progress">

<div
class="result-progress-fill"
style="
width:${result["Pass Rate"]};
">
</div>

</div>

</div>

<table class="result-subject-table">

<thead>

<tr>

<th>
Subject
</th>

<th>
Marks
</th>

<th>
Grade
</th>

<th>
Status
</th>

</tr>

</thead>

<tbody>

${rows}

</tbody>

</table>

</div>

`;

});

html += `
</div>
</div>
`;

document.getElementById(
"dashboard"
).innerHTML = html;

}

</script>

</style>

<div class="dashboard-wrapper">

<div class="search-box">

<input
type="text"
id="searchStudentId"
placeholder="Student ID লিখুন">

<select id="searchClass">

<option value="play">Play</option>
<option value="nursery">Nursery</option>
<option value="kg">KG</option>
<option value="1">Class 1</option>
<option value="2">Class 2</option>
<option value="3">Class 3</option>
<option value="4">Class 4</option>
<option value="5">Class 5</option>

</select>

<button onclick="searchDashboard()">
Result Search
</button>

</div>

<div id="dashboardUI"></div>

</div>

<script>

function formatRate(rate){

let num = parseFloat(rate);

if(num <= 1){
num = num * 100;
}

return num.toFixed(2);

}

async function searchDashboard(){

const studentId =
document.getElementById(
"searchStudentId"
).value.trim();

const className =
document.getElementById(
"searchClass"
).value;

if(!studentId){

alert("Student ID দিন");
return;

}

const res =
await fetch(API_URL,{

method:"POST",

body:JSON.stringify({

action:"getStudentResults",

studentId:studentId

})

});

const data =
await res.json();

const results =
data.results.filter(
r => r["Class"] == className
);

if(results.length === 0){

document.getElementById(
"dashboardUI"
).innerHTML =

`
<div class="no-result">
No Result Found
</div>
`;

return;

}

const student =
results[0];

let averageRate = 0;

results.forEach(r=>{

averageRate +=
parseFloat(
formatRate(
r["Pass Rate"]
)
);

});

averageRate =
(
averageRate /
results.length
).toFixed(2);

let html = `

<div class="dashboard-header">

<div class="dashboard-top">

<div class="student-info">

<h2>
${student["Student Name"]}
</h2>

<p>
Student ID :
${student["Student ID"]}
</p>

<p>
Roll :
${student["Roll"]}
</p>

<p>
Class :
${student["Class"]}
</p>

</div>

<div class="live-badge">
Academic Dashboard
</div>

</div>

</div>

<div class="overview-grid">

<div class="overview-card">

<h4>
Total Exams
</h4>

<h2>
${results.length}
</h2>

</div>

<div class="overview-card">

<h4>
Average Rate
</h4>

<h2>
${averageRate}%
</h2>

</div>

<div class="overview-card">

<h4>
Latest Grade
</h4>

<h2>
${results[results.length-1]["Overall Grade"]}
</h2>

</div>

<div class="overview-card">

<h4>
Latest Status
</h4>

<h2>
${results[results.length-1]["Overall Status"]}
</h2>

</div>

</div>

<div class="chart-card">

<div class="chart-title">
Exam Performance Chart
</div>

<canvas id="resultChart"></canvas>

</div>

<div class="exam-section">
`;

results.forEach(result=>{

const statusClass =
result["Overall Status"] ==
"Pass"
? "pass"
: "fail";

let rows = "";

Object.keys(result).forEach(key=>{

if(key.includes(" Total")){

const sub =
key.replace(" Total","");

rows += `

<tr>

<td>
${sub}
</td>

<td>
${result[sub + " Obtain"]}
/
${result[sub + " Total"]}
</td>

<td>
${result[sub + " Grade"]}
</td>

<td class="${
result[sub + " Status"] ==
"ভালো"
? "good"
: "bad"
}">
${result[sub + " Status"]}
</td>

</tr>

`;

}

});

html += `

<div class="exam-card">

<div class="exam-top">

<div class="exam-title">
${result["Exam Name"]}
</div>

<div class="${statusClass}">
${result["Overall Status"]}
</div>

</div>

<div class="exam-stats">

<div class="exam-stat">

<h5>
Overall Grade
</h5>

<p>
${result["Overall Grade"]}
</p>

</div>

<div class="exam-stat">

<h5>
Pass Rate
</h5>

<p>
${formatRate(result["Pass Rate"])}%
</p>

</div>

<div class="exam-stat">

<h5>
Exam Type
</h5>

<p>
${result["Exam Name"]}
</p>

</div>

</div>

<div class="progress-wrap">

<div class="progress-head">

<span>
Performance
</span>

<span>
${formatRate(result["Pass Rate"])}%
</span>

</div>

<div class="progress">

<div
class="progress-fill"
style="
width:${formatRate(result["Pass Rate"])}%;
">
</div>

</div>

</div>

<table class="subject-table">

<thead>

<tr>

<th>
Subject
</th>

<th>
Marks
</th>

<th>
Grade
</th>

<th>
Status
</th>

</tr>

</thead>

<tbody>

${rows}

</tbody>

</table>

</div>

`;

});

html += `
</div>
`;

document.getElementById(
"dashboardUI"
).innerHTML = html;

setTimeout(()=>{

const ctx =
document.getElementById(
"resultChart"
);

new Chart(ctx,{

type:"bar",

data:{

labels:
results.map(r=>
r["Exam Name"]
),

datasets:[{

label:"Pass Rate (%)",

data:
results.map(r=>
parseFloat(
formatRate(
r["Pass Rate"]
)
)
),

borderWidth:2,
borderRadius:12

}]

},

options:{

responsive:true,

plugins:{

legend:{
display:true
}

},

scales:{

y:{

beginAtZero:true,
max:100,

ticks:{

callback:function(value){

return value + "%";

}

}

}

}

}

});

},300);

}

</script>
  </main>

  <script src="assets/js/wsc-layout.js"></script>
  <script src="assets/js/wsc-search.js"></script>
  <script src="assets/js/wsc-password.js"></script>
</body>
