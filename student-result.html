<style>
.result-page {
  --result-primary: var(--wsc-primary, #2563eb);
  --result-primary-dark: var(--wsc-primary-dark, #1d4ed8);
  --result-bg: var(--wsc-bg, #f6f9ff);
  --result-card: var(--wsc-surface, #ffffff);
  --result-card-soft: var(--wsc-surface-soft, #f1f5ff);
  --result-text: var(--wsc-text, #111827);
  --result-muted: var(--wsc-muted, #6b7280);
  --result-border: var(--wsc-border, #dbe4f0);
  --result-success: var(--wsc-success, #16a34a);
  --result-success-bg: var(--success-bg, #ecfdf3);
  --result-danger: var(--wsc-danger, #dc2626);
  --result-danger-bg: var(--danger-bg, #fff1f2);
  --result-font: var(--wsc-font-bn, "Noto Sans Bengali", system-ui, sans-serif);
  --result-radius-sm: var(--wsc-radius-sm, 8px);
  --result-radius-md: var(--wsc-radius-md, 14px);
  --result-radius-lg: var(--wsc-radius-lg, 22px);
  --result-radius-pill: var(--wsc-radius-pill, 999px);
  --result-shadow: var(--wsc-shadow, 0 14px 40px rgba(15, 23, 42, 0.08));
  --result-transition: var(--wsc-transition, 180ms ease);

  width: 100%;
  min-height: 100%;
  padding: 24px;
  box-sizing: border-box;
  background: var(--result-bg);
  color: var(--result-text);
  font-family: var(--result-font);
  font-size: var(--wsc-text-base, 16px);
}

.result-page * {
  box-sizing: border-box;
}

.result-page .container {
  max-width: 1500px;
  margin: auto;
}

.result-page .top-card {
  background: var(--result-card);
  padding: 25px;
  border-radius: var(--result-radius-lg);
  border: 1px solid var(--result-border);
  box-shadow: var(--result-shadow);
  margin-bottom: 30px;
  color: var(--result-text);
}

.result-page h1 {
  font-size: var(--wsc-text-xl, 28px);
  margin: 0 0 25px;
  text-align: center;
  font-weight: 800;
  color: var(--result-primary);
  letter-spacing: -0.4px;
}

.result-page .grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 18px;
}

.result-page label {
  display: block;
  margin-bottom: 8px;
  font-size: var(--wsc-text-sm, 14px);
  font-weight: 700;
  color: var(--result-text);
}

.result-page input,
.result-page select {
  width: 100%;
  min-height: 48px;
  padding: 0 14px;
  border: 1px solid var(--result-border);
  border-radius: var(--result-radius-md);
  font-size: var(--wsc-text-base, 16px);
  color: var(--result-text);
  outline: none;
  background-color: var(--result-card);
  transition: border-color var(--result-transition), box-shadow var(--result-transition), background var(--result-transition);
  font-family: var(--result-font);
  caret-color: var(--result-primary);
}

/* Native select kept for JS value. It is visually hidden only when custom UI is used. */
.result-page select {
  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;
  cursor: pointer;
  padding-right: 46px;
  font-weight: 700;
  background-image:
    linear-gradient(45deg, transparent 50%, var(--result-primary) 50%),
    linear-gradient(135deg, var(--result-primary) 50%, transparent 50%),
    linear-gradient(to right, var(--result-card-soft), var(--result-card-soft));
  background-position:
    calc(100% - 24px) 21px,
    calc(100% - 17px) 21px,
    calc(100% - 42px) 50%;
  background-size:
    7px 7px,
    7px 7px,
    1px 26px;
  background-repeat: no-repeat;
}

.result-page select::-ms-expand {
  display: none;
}

.result-page select option {
  background: var(--result-card);
  color: var(--result-text);
  font-family: var(--result-font);
  font-size: var(--wsc-text-base, 16px);
}

.result-page .result-native-select {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: 0 !important;
  opacity: 0 !important;
  pointer-events: none !important;
  border: 0 !important;
}

.result-page .result-custom-select {
  position: relative;
  width: 100%;
}

.result-page .result-custom-trigger {
  width: 100%;
  min-height: 48px;
  padding: 0 14px;
  border: 1px solid var(--result-border);
  border-radius: var(--result-radius-md);
  background: var(--result-card);
  color: var(--result-text);
  font-family: var(--result-font);
  font-size: var(--wsc-text-base, 16px);
  font-weight: 800;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  box-shadow: none;
  transition: border-color var(--result-transition), box-shadow var(--result-transition), background var(--result-transition), transform var(--result-transition);
}

.result-page .result-custom-trigger:hover,
.result-page .result-custom-select.open .result-custom-trigger {
  border-color: var(--result-primary);
  background: var(--result-card);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--result-primary) 12%, transparent);
  transform: none;
}

.result-page .result-custom-arrow {
  width: 28px;
  height: 28px;
  border-radius: var(--result-radius-pill);
  background: var(--result-card-soft);
  color: var(--result-primary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: var(--wsc-text-sm, 14px);
  flex: 0 0 auto;
  transition: transform var(--result-transition);
}

.result-page .result-custom-select.open .result-custom-arrow {
  transform: rotate(180deg);
}

.result-page .result-custom-list {
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  right: 0;
  z-index: 999;
  display: none;
  padding: 8px;
  background: var(--result-card);
  border: 1px solid var(--result-border);
  border-radius: var(--result-radius-md);
  box-shadow: var(--result-shadow);
  max-height: 240px;
  overflow-y: auto;
}

.result-page .result-custom-select.open .result-custom-list {
  display: block;
}

.result-page .result-custom-option {
  width: 100%;
  border: 0;
  background: transparent;
  color: var(--result-text);
  padding: 12px 14px;
  border-radius: var(--result-radius-sm);
  font-size: var(--wsc-text-sm, 14px);
  font-family: var(--result-font);
  font-weight: 800;
  text-align: left;
  cursor: pointer;
  transition: background var(--result-transition), color var(--result-transition);
}

.result-page .result-custom-option:hover,
.result-page .result-custom-option.active {
  background: var(--result-card-soft);
  color: var(--result-primary);
}

.result-page .result-custom-option.active::after {
  content: "✓";
  float: right;
  color: var(--result-success);
}

.result-page input::placeholder {
  color: var(--result-muted);
  opacity: 0.85;
}

.result-page input:focus,
.result-page select:focus {
  border-color: var(--result-primary);
  background-color: var(--result-card);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--result-primary) 14%, transparent);
}

.result-page input[readonly] {
  background: var(--result-card-soft);
  color: var(--result-text) !important;
  -webkit-text-fill-color: var(--result-text) !important;
  cursor: default;
  opacity: 1;
}

.result-page input:-webkit-autofill,
.result-page input:-webkit-autofill:hover,
.result-page input:-webkit-autofill:focus {
  -webkit-text-fill-color: var(--result-text) !important;
  caret-color: var(--result-primary);
  box-shadow: 0 0 0 1000px var(--result-card) inset !important;
  transition: background-color 9999s ease-in-out 0s;
}

.result-page .subjects-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
  margin-top: 30px;
}

.result-page .subject {
  background: var(--result-card-soft);
  padding: 20px;
  border-radius: var(--result-radius-lg);
  border: 1px solid var(--result-border);
  color: var(--result-text);
}

.result-page .subject h3 {
  margin: 0 0 18px;
  font-size: var(--wsc-text-md, 18px);
  color: var(--result-text);
  font-weight: 800;
}

.result-page .subject label {
  margin-top: 12px;
}

.result-page .action-buttons {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  margin-top: 30px;
}

.result-page button {
  flex: 1;
  padding: 16px;
  border: none;
  border-radius: var(--result-radius-md);
  font-size: var(--wsc-text-base, 16px);
  font-weight: 800;
  cursor: pointer;
  transition: transform var(--result-transition), background var(--result-transition), opacity var(--result-transition);
  font-family: var(--result-font);
}

.result-page .save-btn {
  background: linear-gradient(135deg, var(--result-primary), var(--result-primary-dark));
  color: #ffffff;
}

.result-page .show-btn {
  background: var(--result-text);
  color: var(--result-card);
}

.result-page button:hover {
  transform: translateY(-2px);
  opacity: 0.95;
}

.result-page .result-dashboard {
  margin-top: 40px;
}

.result-page .result-student-card {
  background: linear-gradient(135deg, var(--result-primary), var(--result-primary-dark));
  padding: 30px;
  border-radius: var(--result-radius-lg);
  color: #ffffff;
  box-shadow: 0 14px 40px color-mix(in srgb, var(--result-primary) 30%, transparent);
  margin-bottom: 30px;
  position: relative;
  overflow: hidden;
}

.result-page .result-student-card::before {
  content: "";
  position: absolute;
  right: -40px;
  top: -40px;
  width: 180px;
  height: 180px;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 50%;
}

.result-page .result-student-card::after {
  content: "";
  position: absolute;
  left: -50px;
  bottom: -50px;
  width: 200px;
  height: 200px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 50%;
}

.result-page .result-student-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 20px;
  position: relative;
  z-index: 2;
}

.result-page .result-student-info h2 {
  font-size: var(--wsc-text-xl, 28px);
  margin: 0 0 10px;
  font-weight: 800;
  color: #ffffff;
}

.result-page .result-student-info p {
  font-size: var(--wsc-text-base, 16px);
  opacity: 0.95;
  line-height: 1.9;
  margin: 0;
}

.result-page .result-badge {
  padding: 12px 20px;
  border-radius: var(--result-radius-pill);
  font-size: var(--wsc-text-sm, 14px);
  font-weight: 800;
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(10px);
}

.result-page .result-exam-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
  gap: 25px;
}

.result-page .result-exam-card {
  background: var(--result-card);
  border-radius: var(--result-radius-lg);
  padding: 25px;
  box-shadow: var(--result-shadow);
  border: 1px solid var(--result-border);
  transition: transform var(--result-transition);
  color: var(--result-text);
}

.result-page .result-exam-card:hover {
  transform: translateY(-5px);
}

.result-page .result-exam-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
  gap: 12px;
}

.result-page .result-exam-title {
  font-size: var(--wsc-text-xl, 28px);
  font-weight: 800;
  color: var(--result-text);
}

.result-page .result-status-pass,
.result-page .pass {
  background: var(--result-success-bg);
  color: var(--result-success);
  padding: 8px 16px;
  border-radius: var(--result-radius-pill);
  font-size: var(--wsc-text-xs, 12px);
  font-weight: 800;
}

.result-page .result-status-fail,
.result-page .fail {
  background: var(--result-danger-bg);
  color: var(--result-danger);
  padding: 8px 16px;
  border-radius: var(--result-radius-pill);
  font-size: var(--wsc-text-xs, 12px);
  font-weight: 800;
}

.result-page .result-summary-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin-bottom: 25px;
}

.result-page .result-summary-box {
  background: var(--result-card-soft);
  padding: 18px;
  border-radius: var(--result-radius-md);
  text-align: center;
  border: 1px solid var(--result-border);
}

.result-page .result-summary-box h4 {
  font-size: var(--wsc-text-xs, 12px);
  color: var(--result-muted);
  margin: 0 0 10px;
  font-weight: 700;
}

.result-page .result-summary-box p {
  font-size: var(--wsc-text-xl, 28px);
  font-weight: 800;
  color: var(--result-text);
  margin: 0;
}

.result-page .result-progress-wrap {
  margin-bottom: 25px;
}

.result-page .result-progress-head {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: var(--wsc-text-sm, 14px);
  font-weight: 800;
  color: var(--result-text);
}

.result-page .result-progress {
  height: 14px;
  background: var(--result-card-soft);
  border: 1px solid var(--result-border);
  border-radius: var(--result-radius-pill);
  overflow: hidden;
}

.result-page .result-progress-fill {
  height: 100%;
  border-radius: var(--result-radius-pill);
  background: linear-gradient(90deg, var(--result-primary), var(--result-primary-dark));
}

.result-page .result-subject-table,
.result-page .subject-table {
  width: 100%;
  border-collapse: collapse;
  overflow: hidden;
  border-radius: var(--result-radius-md);
  background: var(--result-card);
}

.result-page .result-subject-table thead,
.result-page .subject-table thead {
  background: var(--result-text);
  color: var(--result-card);
}

.result-page .result-subject-table th,
.result-page .subject-table th {
  padding: 14px;
  font-size: var(--wsc-text-sm, 14px);
  font-weight: 700;
}

.result-page .result-subject-table td,
.result-page .subject-table td {
  padding: 14px;
  text-align: center;
  font-size: var(--wsc-text-sm, 14px);
  border-bottom: 1px solid var(--result-border);
  color: var(--result-text);
}

.result-page .result-subject-table tbody tr:nth-child(even),
.result-page .subject-table tbody tr:nth-child(even) {
  background: var(--result-card-soft);
}

.result-page .result-good,
.result-page .good {
  color: var(--result-success) !important;
  font-weight: 800;
}

.result-page .result-bad,
.result-page .bad {
  color: var(--result-danger) !important;
  font-weight: 800;
}

.result-page .result-grade {
  font-weight: 800;
  font-size: var(--wsc-text-sm, 14px);
}

.result-page .result-empty,
.result-page .no-result {
  background: var(--result-card);
  padding: 50px;
  border-radius: var(--result-radius-lg);
  text-align: center;
  font-size: var(--wsc-text-lg, 22px);
  font-weight: 800;
  color: var(--result-muted);
  box-shadow: var(--result-shadow);
  border: 1px solid var(--result-border);
}

.result-page .result-subject-name {
  font-weight: 700;
  color: var(--result-text);
}

.result-page .dashboard-wrapper {
  margin-top: 40px;
  font-family: var(--result-font);
}

.result-page .search-box {
  display: flex;
  gap: 15px;
  flex-wrap: wrap;
  margin-bottom: 30px;
}

.result-page .search-box input,
.result-page .search-box select {
  flex: 1;

}

.result-page .search-box button {

  background: linear-gradient(135deg, var(--result-primary), var(--result-primary-dark));

}

.result-page .overview-grid {

.result-page .overview-card {

.result-page .overview-card h2 {

.result-page .chart-card {

.result-page .chart-title {

function resultToggleCustomSelect(customId){
  const custom = document.getElementById(customId);
  document.querySelectorAll('.result-custom-select').forEach(function(item){
    if(item.id !== customId){
      item.classList.remove('open');
    }
  });
  if(custom){
    custom.classList.toggle('open');
  }
}

function resultSelectCustomOption(customId,selectId,textId,value,label,btn){
  const select = document.getElementById(selectId);
  const text = document.getElementById(textId);
  const custom = document.getElementById(customId);

  if(select){
    select.value = value;
    select.dispatchEvent(new Event('change', { bubbles: true }));
  }

  if(text){
    text.textContent = label;
  }

  if(custom){
    custom.querySelectorAll('.result-custom-option').forEach(function(option){
      option.classList.remove('active');
    });
    custom.classList.remove('open');
  }

  if(btn){
    btn.classList.add('active');
  }
}

});
