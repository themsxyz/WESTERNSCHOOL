<!doctype html>
<html lang="bn" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Western School & College</title>

  <!-- CSS files -->
  <link rel="stylesheet" href="assets/css/base/wsc-root.css">
  <link rel="stylesheet" href="assets/css/side-nav/wsc-side-nav.css">
  <link rel="stylesheet" href="assets/css/components/wsc-components.css">
  <link rel="stylesheet" href="assets/css/responsive/wsc-responsive.css">
  <link rel="stylesheet" href="assets/css/shortcode/wsc-shortcode.css">
</head>
<body>
  <!-- Keep this blank. Add custom page content here later if needed. -->
  <main data-wsc-page-content>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>

/* desktop friendly container with refined card - all classes start with .voucher */
.voucherContainer {
  max-width: 1100px;
  width: 100%;
  margin: 0 auto;
  background: var(--wsc-surface);
  border-radius: var(--earn-radius-xl);
  box-shadow: var(--earn-shadow-soft);
  overflow: hidden;
  transition: all var(--wsc-transition);
}

/* header area redesign */
.voucherHeader {
  background: linear-gradient(135deg, var(--earn-navy-dark) 0%, var(--earn-navy) 100%);
  padding: 1.25rem 2rem;
  border-bottom: 1px solid var(--earn-border);
}

.voucherHeader h2 {
  margin: 0;
  font-size: 1.85rem;
  font-weight: 600;
  letter-spacing: -0.3px;
  color: var(--wsc-surface);
  display: flex;
  align-items: center;
  gap: 12px;
}

.voucherHeader h2 i {
  font-size: 1.8rem;
  filter: none;
}

/* main padding area */
.voucherFormMain {
  padding: 2rem 2rem 1.8rem 2rem;
}

/* row layout - desktop 2 column grid */
.voucherTwoColumns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.5rem;
  margin-bottom: 2rem;
}

.voucherInputGroup {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.voucherInputGroup label {
  font-size: 0.85rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--earn-muted);
  display: flex;
  align-items: center;
  gap: 8px;
}

.voucherInputGroup label i {
  font-size: 0.9rem;
  color: var(--earn-blue);
}

.voucherInput, .voucherSelect {
  padding: 0.9rem 1.2rem;
  border: 1.5px solid var(--wsc-border);
  border-radius: var(--earn-radius-md);
  font-family: 'Inter', 'Noto Sans Bengali', sans-serif;
  font-size: 0.95rem;
  background: var(--wsc-surface);
  color: var(--wsc-text);
  outline: none;
  transition: all var(--wsc-transition);
  font-weight: 500;
}

.voucherInput:focus, .voucherSelect:focus {
  border-color: var(--earn-blue);
  box-shadow: 0 0 0 4px var(--earn-border-strong);
}

/* items section styling */
.voucherItemsSection {
  margin-top: 1rem;
  margin-bottom: 1.2rem;
}

.voucherSectionTitle {
  font-weight: 700;
  font-size: 1.1rem;
  margin-bottom: 1.2rem;
  color: var(--wsc-text);
  display: flex;
  align-items: center;
  gap: 10px;
  border-left: 4px solid var(--earn-blue);
  padding-left: 14px;
}

.voucherItemsList {
  background: var(--wsc-surface-soft);
  border-radius: var(--earn-radius-lg);
  padding: 0.25rem 0;
}

.voucherItem {
  display: flex;
  gap: 1rem;
  margin-bottom: 1rem;
  align-items: center;
  background: var(--wsc-surface);
  border-radius: var(--earn-radius-md);
  padding: 0.4rem;
  transition: all var(--wsc-transition);
  border: 1px solid var(--earn-border);
}

.voucherItem:hover {
  border-color: var(--earn-border-strong);
  box-shadow: var(--earn-shadow-soft);
}

.voucherItemInputDesc {
  flex: 2.5;
  padding: 0.9rem 1.2rem;
  border: 1.5px solid var(--wsc-border);
  border-radius: var(--earn-radius-md);
  font-family: 'Inter', 'Noto Sans Bengali', sans-serif;
  font-size: 0.95rem;
  background: var(--wsc-surface);
  color: var(--wsc-text);
  outline: none;
  transition: all var(--wsc-transition);
  font-weight: 500;
}

.voucherItemInputAmount {
  flex: 1;
  padding: 0.9rem 1.2rem;
  border: 1.5px solid var(--wsc-border);
  border-radius: var(--earn-radius-md);
  font-family: 'Inter', 'Noto Sans Bengali', sans-serif;
  font-size: 0.95rem;
  background: var(--wsc-surface);
  color: var(--wsc-text);
  outline: none;
  transition: all var(--wsc-transition);
  font-weight: 500;
}

.voucherItemInputDesc:focus, .voucherItemInputAmount:focus {
  border-color: var(--earn-blue);
  box-shadow: 0 0 0 4px var(--earn-border-strong);
}

.voucherRemoveBtn {
  background: var(--earn-danger-bg);
  color: var(--earn-danger);
  padding: 0.65rem 1.2rem;
  border-radius: var(--earn-radius-pill);
  font-weight: 600;
  font-size: 0.8rem;
  transition: var(--wsc-transition);
  width: auto;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: none;
  cursor: pointer;
}

.voucherRemoveBtn:hover {
  background: var(--danger-bg);
  color: var(--danger);
  transform: scale(0.98);
}

.voucherBtn {
  padding: 0.8rem 1.8rem;
  border: none;
  background: var(--wsc-surface-soft);
  color: var(--wsc-text);
  border-radius: var(--earn-radius-pill);
  cursor: pointer;
  font-family: 'Inter', 'Noto Sans Bengali', sans-serif;
  font-weight: 600;
  font-size: 0.9rem;
  transition: var(--wsc-transition);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  justify-content: center;
}

.voucherBtn i {
  font-size: 0.9rem;
}

.voucherBtn:hover {
  background: var(--blue-soft);
  transform: translateY(-1px);
}

.voucherAddBtn {
  background: var(--wsc-surface-soft);
  color: var(--earn-blue);
  border: 1px solid #cbdde9;
  margin-top: 0.5rem;
}

.voucherAddBtn:hover {
  background: var(--blue-soft);
}

.voucherTotal {
  font-size: 1.5rem;
  font-weight: 800;
  margin-top: 1.5rem;
  margin-bottom: 1.8rem;
  padding: 1rem 1.8rem;
  background: linear-gradient(115deg, var(--wsc-surface-soft) 0%, var(--wsc-surface) 100%);
  border-radius: var(--earn-radius-pill);
  display: flex;
  justify-content: space-between;
  align-items: center;
  border: 1px solid var(--wsc-border);
  color: var(--earn-blue);
}

.voucherTotalLabel {
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: 0.3px;
  color: var(--earn-muted);
}

.voucherTotalAmount {
  font-size: 1.8rem;
  font-weight: 800;
  background: linear-gradient(135deg, var(--earn-blue), var(--earn-navy-dark));
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
}

.voucherSubmitBtn {
  width: 100%;
  background: linear-gradient(95deg, var(--earn-navy-dark) 0%, var(--earn-blue) 100%);
  color: var(--wsc-surface);
  font-size: 1rem;
  font-weight: 700;
  padding: 1rem;
  border-radius: var(--earn-radius-pill);
  box-shadow: var(--earn-shadow-soft);
  margin-top: 0.5rem;
  border: none;
  cursor: pointer;
}

.voucherSubmitBtn:hover {
  background: linear-gradient(95deg, var(--earn-navy) 0%, var(--earn-blue) 100%);
  transform: translateY(-2px);
  box-shadow: var(--earn-shadow);
}

/* pdf result card */
.voucherPdfResult {
  background: var(--earn-success-bg);
  border-radius: var(--earn-radius-lg);
  padding: 1.6rem 2rem;
  margin-top: 2rem;
  border-left: 6px solid var(--earn-success);
  animation: voucherFadeSlideUp var(--wsc-transition);
}

.voucherPdfResult strong {
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--earn-success);
  margin-bottom: 0.75rem;
  display: flex;
  align-items: center;
  gap: 10px;
}

.voucherPdfButtons {
  display: flex;
  gap: 1rem;
  margin: 1rem 0 0.8rem;
  flex-wrap: wrap;
}

.voucherOpenBtn, .voucherDownloadBtn {
  background: var(--earn-navy);
  color: var(--wsc-surface);
  padding: 0.7rem 1.6rem;
  font-weight: 600;
  border: none;
}

.voucherOpenBtn:hover, .voucherDownloadBtn:hover {
  background: var(--earn-navy-dark);
}

.voucherDownloadBtn {
  background: var(--earn-success);
}

.voucherPrintNote {
  background: var(--wsc-surface-soft);
  padding: 0.6rem 1rem;
  border-radius: var(--earn-radius-lg);
  font-size: 0.8rem;
  color: var(--wsc-muted);
  margin-top: 1rem;
  display: inline-block;
}

.voucherErrorBox {
  margin-top: 1rem;
  padding: 1rem 1.5rem;
  background: var(--earn-danger-bg);
  border-radius: var(--earn-radius-lg);
  color: var(--earn-danger);
  font-weight: 500;
  border-left: 5px solid var(--earn-danger);
  display: none;
}

.voucherSuccessText {
  font-weight: 800;
  background: var(--earn-success-bg);
  padding: 0.2rem 0.8rem;
  border-radius: var(--earn-radius-pill);
  display: inline-block;
  font-family: monospace;
}

/* modern scroll & tiny adjustments */
input::-webkit-outer-spin-button,
input::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

input[type=number] {
  -moz-appearance: textfield;
}

@media (max-width: 780px) {
  body {
    padding: 1rem;
  }
  .voucherTwoColumns {
    grid-template-columns: 1fr;
    gap: 1rem;
  }
  .voucherItem {
    flex-wrap: wrap;
    padding: 0.8rem;
  }
  .voucherItemInputDesc, .voucherItemInputAmount {
    flex: 1 1 100%;
  }
  .voucherRemoveBtn {
    width: 100%;
    justify-content: center;
  }
  .voucherFormMain {
    padding: 1.5rem;
  }
  .voucherTotal {
    flex-direction: column;
    align-items: flex-start;
    gap: 0.5rem;
  }
}

@keyframes voucherFadeSlideUp {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* subtle icon spacing */
.fa, .fas, .far {
  font-size: 0.9em;
}

/* custom calendar and dropdown - no browser default UI */
.voucherDatePicker,
.voucherDropdown {
  position: relative;
  width: 100%;
}

.voucherDateTrigger,
.voucherDropdownTrigger {
  width: 100%;
  min-height: 52px;
  padding: 0.9rem 1.2rem;
  border: 1.5px solid var(--wsc-border);
  border-radius: var(--earn-radius-md);
  font-family: 'Inter', 'Noto Sans Bengali', sans-serif;
  font-size: 0.95rem;
  background: var(--wsc-surface);
  color: var(--wsc-text);
  outline: none;
  transition: all var(--wsc-transition);
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  text-align: left;
}

.voucherDateTrigger:hover,
.voucherDropdownTrigger:hover,
.voucherDatePicker.isOpen .voucherDateTrigger,
.voucherDropdown.isOpen .voucherDropdownTrigger {
  border-color: var(--earn-blue);
  box-shadow: 0 0 0 4px rgba(26, 74, 111, 0.10);
}

.voucherDateTrigger i,
.voucherDropdownTrigger i {
  color: var(--earn-blue);
  font-size: 0.95rem;
  flex: 0 0 auto;
}

.voucherDropdown.isOpen .voucherDropdownTrigger i {
  transform: rotate(180deg);
}

.voucherDropdownMenu,
.voucherCalendarPanel {
  position: absolute;
  z-index: 1000;
  top: calc(100% + 10px);
  left: 0;
  right: 0;
  background: var(--wsc-surface);
  border: 1px solid var(--wsc-border);
  border-radius: var(--wsc-radius-lg);
  box-shadow: var(--earn-shadow-soft);
  display: none;
  overflow: hidden;
}

.voucherDropdown.isOpen .voucherDropdownMenu,
.voucherDatePicker.isOpen .voucherCalendarPanel {
  display: block;
  animation: voucherFadeSlideUp var(--wsc-transition);
}

.voucherDropdownMenu {
  max-height: 250px;
  overflow-y: auto;
  padding: 0.45rem;
}

.voucherDropdownOption {
  width: 100%;
  border: none;
  background: transparent;
  color: var(--wsc-text);
  padding: 0.85rem 1rem;
  border-radius: var(--wsc-radius-md);
  cursor: pointer;
  text-align: left;
  font-family: 'Inter', 'Noto Sans Bengali', sans-serif;
  font-size: 0.93rem;
  font-weight: 600;
  transition: var(--wsc-transition);
}

.voucherDropdownOption:hover {
  background: var(--wsc-surface-soft);
  color: var(--earn-blue);
}

.voucherDropdownOption.isSelected {
  background: var(--blue-soft);
  color: var(--earn-navy-dark);
}

.voucherDropdownOption.isDisabled {
  cursor: not-allowed;
  color: var(--muted);
}

.voucherCalendarPanel {
  padding: 1rem;
}

.voucherCalendarHead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 0.9rem;
}

.voucherCalendarMonth {
  color: var(--earn-navy-dark);
  font-weight: 800;
  font-size: 1rem;
  text-align: center;
}

.voucherCalNav {
  width: 36px;
  height: 36px;
  border: 1px solid var(--wsc-border);
  border-radius: var(--wsc-radius-md);
  background: var(--wsc-surface-soft);
  color: var(--earn-blue);
  cursor: pointer;
  font-size: 1.25rem;
  font-weight: 800;
  line-height: 1;
  transition: var(--wsc-transition);
}

.voucherCalNav:hover {
  background: var(--blue-soft);
  border-color: var(--earn-blue);
}

.voucherCalendarWeek,
.voucherCalendarDays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}

.voucherCalendarWeek {
  margin-bottom: 7px;
}

.voucherCalendarWeek span {
  color: var(--muted);
  text-align: center;
  font-size: 0.72rem;
  font-weight: 800;
}

.voucherCalEmpty,
.voucherCalDay {
  min-height: 36px;
  border-radius: var(--wsc-radius-md);
}

.voucherCalDay {
  border: 1px solid transparent;
  background: var(--wsc-surface-soft);
  color: var(--wsc-text);
  cursor: pointer;
  font-family: 'Inter', 'Noto Sans Bengali', sans-serif;
  font-size: 0.84rem;
  font-weight: 700;
  transition: var(--wsc-transition);
}

.voucherCalDay:hover {
  background: var(--blue-soft);
  color: var(--earn-blue);
}

.voucherCalDay.isToday {
  border-color: var(--earn-blue);
  color: var(--earn-blue);
}

.voucherCalDay.isSelected {
  background: var(--earn-blue);
  color: var(--wsc-surface);
  border-color: var(--earn-blue);
}

.voucherCalendarActions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 0.9rem;
  padding-top: 0.9rem;
  border-top: 1px solid var(--earn-border);
}

.voucherCalAction {
  min-height: 38px;
  border: 1px solid var(--wsc-border);
  border-radius: var(--wsc-radius-md);
  background: var(--wsc-surface-soft);
  color: var(--wsc-text);
  cursor: pointer;
  font-family: 'Inter', 'Noto Sans Bengali', sans-serif;
  font-size: 0.84rem;
  font-weight: 700;
  transition: var(--wsc-transition);
}

.voucherCalAction:hover {
  background: var(--blue-soft);
  color: var(--earn-blue);
}

.voucherCalActionPrimary {
  background: var(--earn-blue);
  border-color: var(--earn-blue);
  color: var(--wsc-surface);
}

.voucherCalActionPrimary:hover {
  background: var(--earn-navy-dark);
  color: var(--wsc-surface);
}

@media (max-width: 780px) {
  .voucherDropdownMenu,
  .voucherCalendarPanel {
    position: relative;
    top: 8px;
  }
}
.voucherInput,
.voucherSelect,
.voucherItemInputDesc,
.voucherItemInputAmount,
.voucherDateTrigger,
.voucherDropdownTrigger {
  min-height: 52px;
  padding: 0.9rem 1.25rem;
  border: 1.5px solid var(--wsc-border);
  border-radius: var(--earn-radius-pill);
  background: var(--wsc-surface);
  color: var(--wsc-text);
  font-family: var(--wsc-font-bn);
  font-size: var(--wsc-text-sm);
  font-weight: 600;
  outline: none;
  box-shadow: none;
  transition: border-color var(--wsc-transition), background var(--wsc-transition), color var(--wsc-transition);
}

.voucherInput:hover,
.voucherSelect:hover,
.voucherItemInputDesc:hover,
.voucherItemInputAmount:hover,
.voucherDateTrigger:hover,
.voucherDropdownTrigger:hover,
.voucherDatePicker.isOpen .voucherDateTrigger,
.voucherDropdown.isOpen .voucherDropdownTrigger {
  border-color: var(--wsc-primary);
  background: var(--wsc-surface);
  box-shadow: none;
}

.voucherInput:focus,
.voucherSelect:focus,
.voucherItemInputDesc:focus,
.voucherItemInputAmount:focus {
  border-color: var(--wsc-primary);
  background: var(--wsc-surface);
  box-shadow: none;
}

.voucherInput::placeholder,
.voucherItemInputDesc::placeholder,
.voucherItemInputAmount::placeholder {
  color: var(--wsc-muted);
}

.voucherItem {
  border-radius: var(--earn-radius-pill);
}

.voucherDropdownMenu,
.voucherCalendarPanel {
  border-radius: var(--earn-radius-lg);
}

.voucherDropdownOption,
.voucherCalDay,
.voucherCalNav,
.v
</style>

<div class="voucherContainer">
  <div class="voucherHeader">
    <h2>
      <i class="fas fa-receipt"></i> 
      ভাউচার মেকার
    </h2>
  </div>

  <div class="voucherFormMain">
    <div class="voucherTwoColumns">
      <div class="voucherInputGroup">
        <label><i class="far fa-calendar-alt"></i> তারিখ</label>
        <div class="voucherDatePicker" id="datePicker">
          <input type="hidden" id="date">
          <button type="button" class="voucherDateTrigger" id="dateTrigger">
            <span id="dateText">তারিখ নির্বাচন করুন</span>
            <i class="far fa-calendar-alt"></i>
          </button>

          <div class="voucherCalendarPanel" id="calendarPanel">
            <div class="voucherCalendarHead">
              <button type="button" class="voucherCalNav" id="prevMonth">‹</button>
              <div class="voucherCalendarMonth" id="calendarMonth"></div>
              <button type="button" class="voucherCalNav" id="nextMonth">›</button>
            </div>

            <div class="voucherCalendarWeek">
              <span>রবি</span>
              <span>সোম</span>
              <span>মঙ্গল</span>
              <span>বুধ</span>
              <span>বৃহঃ</span>
              <span>শুক্র</span>
              <span>শনি</span>
            </div>

            <div class="voucherCalendarDays" id="calendarDays"></div>

            <div class="voucherCalendarActions">
              <button type="button" class="voucherCalAction" id="clearDate">মুছুন</button>
              <button type="button" class="voucherCalAction voucherCalActionPrimary" id="todayDate">আজ</button>
            </div>
          </div>
        </div>
      </div>
      <div class="voucherInputGroup">
        <label><i class="fas fa-tag"></i> ক্যাটাগরি</label>
        <div class="voucherDropdown" id="categoryDropdown">
          <input type="hidden" id="category">
          <button type="button" class="voucherDropdownTrigger" id="categoryTrigger">
            <span id="categoryText">ক্যাটাগরি লোড হচ্ছে...</span>
            <i class="fas fa-chevron-down"></i>
          </button>
          <div class="voucherDropdownMenu" id="categoryMenu"></div>
        </div>
      </div>
    </div>

    <div class="voucherItemsSection">
      <div class="voucherSectionTitle">
        <i class="fas fa-list-ul"></i> আইটেম লিস্ট
      </div>
      <div id="items"></div>
      <button type="button" class="voucherBtn voucherAddBtn" onclick="addItem()">
        <i class="fas fa-plus-circle"></i> আরও যোগ করুন
      </button>
    </div>

    <div class="voucherTotal">
      <span class="voucherTotalLabel"><i class="fas fa-calculator"></i> মোট টাকার পরিমাণ</span>
      <span><span id="total" class="voucherTotalAmount">0</span> <span style="font-size: 0.9rem;">টাকা</span></span>
    </div>

    <div class="voucherActionArea">
      <button type="button" id="submitBtn" class="voucherSubmitBtn" onclick="submitVoucher()">
        <i class="fas fa-save"></i> ভাউচার সেভ ও PDF তৈরি
      </button>
    </div>

    <div id="errorBox" class="voucherErrorBox"></div>

    <div id="pdfResult" class="voucherPdfResult" style="display: none;">
      <strong><i class="fas fa-check-circle"></i> PDF সফলভাবে তৈরি হয়েছে!</strong>
      <p style="margin: 10px 0 6px 0;">
        Voucher No: 
        <span id="voucherNoText" class="voucherSuccessText"></span>
      </p>
      <div class="voucherPdfButtons">
        <a id="viewPdfLink" href="#" target="_blank">
          <button type="button" class="voucherBtn voucherOpenBtn"><i class="fas fa-eye"></i> PDF ওপেন / প্রিন্ট</button>
        </a>
        <a id="downloadPdfLink" href="#" target="_blank">
          <button type="button" class="voucherBtn voucherDownloadBtn"><i class="fas fa-download"></i> PDF ডাউনলোড</button>
        </a>
      </div>
      <p class="voucherPrintNote">
        <i class="fas fa-print"></i> Print করার জন্য “PDF ওপেন / প্রিন্ট” এ ক্লিক করে browser থেকে Ctrl + P চাপুন।
      </p>
    </div>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxMegDeUZTVurpiGLpvzD1m9taVM_7wg9yYLGzJZuZ8DOcVxIV_HHa0ayxoqR2i7PEX/exec";

let calendarViewDate = new Date();

const bnDigits = ["০", "১", "২", "৩", "৪", "৫", "৬", "৭", "৮", "৯"];
const bnMonths = [
  "জানুয়ারি",
  "ফেব্রুয়ারি",
  "মার্চ",
  "এপ্রিল",
  "মে",
  "জুন",
  "জুলাই",
  "আগস্ট",
  "সেপ্টেম্বর",
  "অক্টোবর",
  "নভেম্বর",
  "ডিসেম্বর"
];

window.onload = function(){
  initCustomCalendar();
  initCustomDropdown();
  setTodayDate();
  addItem();
  loadCategories();
};

function toBanglaNumber(value){
  return String(value).replace(/\d/g, digit => bnDigits[digit]);
}

function padDatePart(value){
  return String(value).padStart(2, "0");
}

function formatISODate(date){
  return `${date.getFullYear()}-${padDatePart(date.getMonth() + 1)}-${padDatePart(date.getDate())}`;
}

function parseISODate(value){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(value || "")) return null;
  const parts = value.split("-").map(Number);
  const date = new Date(parts[0], parts[1] - 1, parts[2]);
  if(
    date.getFullYear() !== parts[0] ||
    date.getMonth() !== parts[1] - 1 ||
    date.getDate() !== parts[2]
  ){
    return null;
  }
  return date;
}

function formatDisplayDate(date){
  return `${toBanglaNumber(date.getDate())} ${bnMonths[date.getMonth()]} ${toBanglaNumber(date.getFullYear())}`;
}

function closeCustomCalendar(){
  const datePicker = document.getElementById("datePicker");
  if(datePicker) datePicker.classList.remove("isOpen");
}

function closeCustomDropdown(){
  const dropdown = document.getElementById("categoryDropdown");
  if(dropdown) dropdown.classList.remove("isOpen");
}

function initCustomCalendar(){
  const datePicker = document.getElementById("datePicker");
  const trigger = document.getElementById("dateTrigger");

  trigger.addEventListener("click", function(event){
    event.stopPropagation();
    closeCustomDropdown();
    datePicker.classList.toggle("isOpen");
    renderCalendar();
  });

  document.getElementById("prevMonth").addEventListener("click", function(event){
    event.stopPropagation();
    calendarViewDate = new Date(calendarViewDate.getFullYear(), calendarViewDate.getMonth() - 1, 1);
    renderCalendar();
  });

  document.getElementById("nextMonth").addEventListener("click", function(event){
    event.stopPropagation();
    calendarViewDate = new Date(calendarViewDate.getFullYear(), calendarViewDate.getMonth() + 1, 1);
    renderCalendar();
  });

  document.getElementById("todayDate").addEventListener("click", function(event){
    event.stopPropagation();
    setCustomDate(new Date());
    closeCustomCalendar();
  });

  document.getElementById("clearDate").addEventListener("click", function(event){
    event.stopPropagation();
    document.getElementById("date").value = "";
    document.getElementById("dateText").innerText = "তারিখ নির্বাচন করুন";
    closeCustomCalendar();
  });

  document.getElementById("calendarPanel").addEventListener("click", function(event){
    event.stopPropagation();
    const dayButton = event.target.closest("[data-date]");
    if(dayButton){
      const selectedDate = parseISODate(dayButton.dataset.date);
      if(selectedDate){
        setCustomDate(selectedDate);
        closeCustomCalendar();
      }
    }
  });

  document.addEventListener("click", closeCustomCalendar);
  document.addEventListener("keydown", function(event){
    if(event.key === "Escape") closeCustomCalendar();
  });
}

function setTodayDate(){
  setCustomDate(new Date());
}

function setCustomDate(date){
  document.getElementById("date").value = formatISODate(date);
  document.getElementById("dateText").innerText = formatDisplayDate(date);
  calendarViewDate = new Date(date.getFullYear(), date.getMonth(), 1);
  renderCalendar();
}

function renderCalendar(){
  const monthLabel = document.getElementById("calendarMonth");
  const daysContainer = document.getElementById("calendarDays");
  const selectedValue = document.getElementById("date").value;
  const todayValue = formatISODate(new Date());

  const year = calendarViewDate.getFullYear();
  const month = calendarViewDate.getMonth();
  const firstDay = new Date(year, month, 1);
  const totalDays = new Date(year, month + 1, 0).getDate();
  const startOffset = firstDay.getDay();

  monthLabel.innerText = `${bnMonths[month]} ${toBanglaNumber(year)}`;
  daysContainer.innerHTML = "";

  for(let i = 0; i < startOffset; i++){
    const empty = document.createElement("span");
    empty.className = "voucherCalEmpty";
    daysContainer.appendChild(empty);
  }

  for(let day = 1; day <= totalDays; day++){
    const date = new Date(year, month, day);
    const iso = formatISODate(date);
    const button = document.createElement("button");

    button.type = "button";
    button.className = "voucherCalDay";
    button.dataset.date = iso;
    button.innerText = toBanglaNumber(day);

    if(iso === todayValue) button.classList.add("isToday");
    if(iso === selectedValue) button.classList.add("isSelected");

    daysContainer.appendChild(button);
  }
}

function initCustomDropdown(){
  const dropdown = document.getElementById("categoryDropdown");
  const trigger = document.getElementById("categoryTrigger");

  trigger.addEventListener("click", function(event){
    event.stopPropagation();
    closeCustomCalendar();
    dropdown.classList.toggle("isOpen");
  });

  document.getElementById("categoryMenu").addEventListener("click", function(event){
    event.stopPropagation();
    const option = event.target.closest("[data-category]");
    if(option && !option.classList.contains("isDisabled")){
      setCategoryValue(option.dataset.category);
      closeCustomDropdown();
    }
  });

  document.addEventListener("click", closeCustomDropdown);
  document.addEventListener("keydown", function(event){
    if(event.key === "Escape") closeCustomDropdown();
  });
}

function setCategoryValue(value){
  document.getElementById("category").value = value || "";
  document.getElementById("categoryText").innerText = value || "ক্যাটাগরি নির্বাচন করুন";

  document.querySelectorAll(".voucherDropdownOption").forEach(option => {
    option.classList.toggle("isSelected", option.dataset.category === value);
  });
}

function renderCategoryOptions(categories){
  const menu = document.getElementById("categoryMenu");
  menu.innerHTML = "";

  if(!Array.isArray(categories) || categories.length === 0){
    const empty = document.createElement("button");
    empty.type = "button";
    empty.className = "voucherDropdownOption isDisabled";
    empty.innerText = "Category পাওয়া যায়নি";
    menu.appendChild(empty);
    setCategoryValue("");
    return;
  }

  categories.forEach(cat => {
    const option = document.createElement("button");
    option.type = "button";
    option.className = "voucherDropdownOption";
    option.dataset.category = cat;
    option.innerText = cat;
    menu.appendChild(option);
  });

  setCategoryValue(categories[0]);
}

async function loadCategories(){
  document.getElementById("categoryText").innerText = "ক্যাটাগরি লোড হচ্ছে...";
  document.getElementById("category").value = "";
  document.getElementById("categoryMenu").innerHTML = `
    <button type="button" class="voucherDropdownOption isDisabled">Loading...</button>
  `;

  try{
    const res = await fetch(API_URL);
    const data = await res.json();

    if(data.status === "success" && data.categories){
      renderCategoryOptions(data.categories);
    }else{
      renderCategoryOptions([]);
      showError("Category Load Failed");
    }
  }catch(error){
    renderCategoryOptions([]);
    showError("Category load করা যায়নি। Apps Script URL check করুন।");
  }
}

function addItem(){
  const div = document.createElement("div");
  div.className = "voucherItem";
  div.innerHTML = `
    <input 
      type="text" 
      class="voucherItemInputDesc" 
      placeholder="বিবরণ (যেমন: পেট্রোল, খাবার)"
      onblur="formatDescription(this)"
      oninput="liveCleanDescription(this)"
    >
    <input 
      type="number" 
      class="voucherItemInputAmount" 
      placeholder="টাকার পরিমাণ" 
      oninput="calculateTotal()"
    >
    <button type="button" class="voucherRemoveBtn" onclick="removeItem(this)">
      <i class="fas fa-trash-alt"></i> Remove
    </button>
  `;
  document.getElementById("items").appendChild(div);
}

function liveCleanDescription(input){
  input.value = input.value.replace(/\s+/g, " ");
}

function formatDescription(input){
  let text = input.value.trim();
  text = text.replace(/\s+/g, " ");
  text = text.toLowerCase().replace(/\b[a-z]/g, function(letter){
    return letter.toUpperCase();
  });
  input.value = text;
}

function removeItem(button){
  const itemRows = document.querySelectorAll(".voucherItem");
  if(itemRows.length > 1){
    button.parentElement.remove();
    calculateTotal();
  }else{
    showError("কমপক্ষে একটি item থাকতে হবে।");
  }
}

function calculateTotal(){
  let total = 0;
  document.querySelectorAll(".voucherItemInputAmount").forEach(input => {
    total += Number(input.value) || 0;
  });
  document.getElementById("total").innerText = total.toLocaleString("en-IN");
}

function showError(message){
  const errorBox = document.getElementById("errorBox");
  errorBox.innerText = message;
  errorBox.style.display = "block";
  setTimeout(() => {
    if(errorBox.innerText === message) errorBox.style.display = "none";
  }, 4000);
}

function hideError(){
  const errorBox = document.getElementById("errorBox");
  errorBox.innerText = "";
  errorBox.style.display = "none";
}

function validateForm(){
  const date = document.getElementById("date").value;
  const category = document.getElementById("category").value;
  const items = [];

  document.querySelectorAll(".voucherItem").forEach(row => {
    const description = row.querySelector(".voucherItemInputDesc").value.trim();
    const amount = row.querySelector(".voucherItemInputAmount").value;
    if(description && amount){
      items.push({ description, amount });
    }
  });

  if(!date){
    showError("তারিখ দিন।");
    return false;
  }
  if(!category){
    showError("Category select করুন।");
    return false;
  }
  if(items.length === 0){
    showError("কমপক্ষে একটি description এবং amount দিন।");
    return false;
  }
  return true;
}

async function submitVoucher(){
  hideError();
  document.getElementById("pdfResult").style.display = "none";

  document.querySelectorAll(".voucherItemInputDesc").forEach(input => {
    formatDescription(input);
  });

  if(!validateForm()){
    return;
  }

  const submitBtn = document.getElementById("submitBtn");
  submitBtn.disabled = true;
  submitBtn.innerHTML = `<i class="fas fa-spinner fa-pulse"></i> PDF তৈরি হচ্ছে...`;

  const items = [];
  document.querySelectorAll(".voucherItem").forEach(row => {
    const description = row.querySelector(".voucherItemInputDesc").value.trim();
    const amount = row.querySelector(".voucherItemInputAmount").value;
    if(description && amount){
      items.push({ description, amount });
    }
  });

  const payload = {
    date: document.getElementById("date").value,
    category: document.getElementById("category").value,
    items: items
  };

  try{
    const res = await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    });
    const data = await res.json();

    if(data.status === "success"){
      document.getElementById("voucherNoText").innerText = data.voucherNo;
      document.getElementById("viewPdfLink").href = data.pdf;
      document.getElementById("downloadPdfLink").href = data.downloadPdf || data.pdf;
      document.getElementById("pdfResult").style.display = "block";
      clearFormAfterSuccess();
    }else{
      showError(data.message || "Something went wrong.");
    }
  }catch(error){
    console.error(error);
    showError("PDF তৈরি করা যায়নি। Apps Script deployment এবং permission check করুন।");
  }

  submitBtn.disabled = false;
  submitBtn.innerHTML = `<i class="fas fa-save"></i> ভাউচার সেভ ও PDF তৈরি`;
}

function clearFormAfterSuccess(){
  document.getElementById("items").innerHTML = "";
  addItem();
  calculateTotal();
  setTodayDate();
}
</script>

  </main>
