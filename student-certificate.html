  <main data-wsc-page-content>
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<style>
.prottoyon{
  max-width:1200px;
  margin:50px auto;
  padding:30px;
  font-family:var(--wsc-font-bn);
  color:var(--wsc-text);
  backdrop-filter:blur(15px);
  background:var(--earn-card);
  border:1px solid var(--earn-border);
  border-radius:var(--earn-radius-xl);
  box-shadow:var(--earn-shadow);
}

.prottoyon h2{
  text-align:center;
  margin-bottom:30px;
  color:var(--wsc-primary);
  font-family:var(--wsc-font-bn);
  font-size:var(--wsc-text-xl);
  line-height:1.25;
  font-weight:800;
}

.prottoyon label{
  display:block;
  margin-bottom:6px;
  color:var(--wsc-text);
  font-family:var(--wsc-font-bn);
  font-size:var(--wsc-text-sm);
  line-height:1.4;
  font-weight:700;
}

.prottoyon input,
.prottoyon textarea{
  width:100%;
  padding:12px 16px;
  margin-bottom:15px;
  box-sizing:border-box;
  font-family:var(--wsc-font-bn);
  font-size:var(--wsc-text-base);
  line-height:1.5;
  color:var(--wsc-text);
  background:var(--wsc-surface);
  border:1px solid var(--wsc-border);
  border-radius:var(--earn-radius-pill);
  outline:none;
  transition:border-color var(--wsc-transition), box-shadow var(--wsc-transition), background var(--wsc-transition);
}

.prottoyon textarea{
  resize:vertical;
  min-height:80px;
  border-radius:var(--wsc-radius-md);
}

.prottoyon input::placeholder,
.prottoyon textarea::placeholder{
  color:var(--wsc-muted);
}

.prottoyon input:focus,
.prottoyon textarea:focus{
  border-color:var(--wsc-primary);
  box-shadow:0 0 0 4px rgba(37, 99, 235, 0.12);
  background:var(--wsc-surface);
}

.custom-select{
  position:relative;
  width:100%;
  margin-bottom:15px;
  font-family:var(--wsc-font-bn);
}

.select-selected{
  padding:12px 16px;
  cursor:pointer;
  font-family:var(--wsc-font-bn);
  font-size:var(--wsc-text-base);
  line-height:1.5;
  color:var(--wsc-text);
  background:var(--wsc-surface);
  border:1px solid var(--wsc-border);
  border-radius:var(--earn-radius-pill);
  transition:border-color var(--wsc-transition), box-shadow var(--wsc-transition), background var(--wsc-transition);
}

.select-selected:hover{
  border-color:var(--wsc-primary);
  box-shadow:0 0 0 4px rgba(37, 99, 235, 0.10);
}

.select-items{
  position:absolute;
  top:calc(100% + 6px);
  left:0;
  right:0;
  z-index:99;
  display:none;
  overflow:hidden;
  background:var(--wsc-surface);
  border:1px solid var(--wsc-border);
  border-radius:var(--wsc-radius-md);
  box-shadow:var(--wsc-shadow);
}

.select-items div{
  padding:12px 16px;
  cursor:pointer;
  color:var(--wsc-text);
  font-family:var(--wsc-font-bn);
  font-size:var(--wsc-text-sm);
  line-height:1.45;
  transition:background var(--wsc-transition), color var(--wsc-transition);
}

.select-items div:hover{
  background:var(--wsc-primary);
  color:#ffffff;
}

.btn{
  width:100%;
  padding:15px 0;
  cursor:pointer;
  border:0;
  border-radius:var(--earn-radius-pill);
  background:var(--wsc-primary);
  color:#ffffff;
  font-family:var(--wsc-font-bn);
  font-size:var(--wsc-text-base);
  line-height:1.4;
  font-weight:800;
  box-shadow:var(--earn-shadow-soft);
  transition:background var(--wsc-transition), transform var(--wsc-transition), box-shadow var(--wsc-transition);
}

.btn:hover{
  background:var(--wsc-primary-dark);
  transform:translateY(-1px);
  box-shadow:var(--earn-shadow);
}

.result{
  display:none;
  margin-top:20px;
  padding:15px 16px;
  border-radius:var(--wsc-radius-md);
  font-family:var(--wsc-font-bn);
  font-size:var(--wsc-text-sm);
  line-height:1.5;
  color:var(--wsc-text);
  background:var(--wsc-surface-soft);
  border:1px solid var(--wsc-border);
}

.result.success{
  color:var(--success);
  background:var(--success-bg);
  border-color:var(--success);
}

.result.error{
  color:var(--danger);
  background:var(--danger-bg);
  border-color:var(--danger);
}

.result a{
  display:inline-block;
  margin:5px;
  color:var(--wsc-primary);
  font-family:var(--wsc-font-bn);
  font-size:var(--wsc-text-sm);
  font-weight:700;
  text-decoration:none;
}

.result a:hover{
  color:var(--wsc-primary-dark);
  text-decoration:underline;
}

/* Flatpickr Calendar Theme From Root Variables */
.flatpickr-calendar{
  font-family:var(--wsc-font-bn);
  background:var(--wsc-surface);
  border:1px solid var(--wsc-border);
  border-radius:var(--wsc-radius-lg);
  box-shadow:var(--wsc-shadow);
  color:var(--wsc-text);
  overflow:hidden;
}

.flatpickr-calendar.arrowTop:before,
.flatpickr-calendar.arrowTop:after{
  border-bottom-color:var(--wsc-surface);
}

.flatpickr-calendar.arrowBottom:before,
.flatpickr-calendar.arrowBottom:after{
  border-top-color:var(--wsc-surface);
}

.flatpickr-months,
.flatpickr-months .flatpickr-month,
.flatpickr-weekdays{
  background:var(--wsc-surface-soft);
  color:var(--wsc-text);
  fill:var(--wsc-text);
}

.flatpickr-current-month,
.flatpickr-current-month input.cur-year,
.flatpickr-current-month .flatpickr-monthDropdown-months{
  font-family:var(--wsc-font-bn);
  color:var(--wsc-text);
  background:var(--wsc-surface-soft);
  font-size:var(--wsc-text-base);
  font-weight:700;
}

.flatpickr-current-month input.cur-year:focus,
.flatpickr-current-month .flatpickr-monthDropdown-months:focus{
  outline:none;
  background:var(--wsc-surface);
}

.flatpickr-monthDropdown-month{
  background:var(--wsc-surface);
  color:var(--wsc-text);
}

.flatpickr-months .flatpickr-prev-month,
.flatpickr-months .flatpickr-next-month{
  color:var(--wsc-text);
  fill:var(--wsc-text);
}

.flatpickr-months .flatpickr-prev-month:hover,
.flatpickr-months .flatpickr-next-month:hover{
  color:var(--wsc-primary);
  fill:var(--wsc-primary);
}

span.flatpickr-weekday{
  font-family:var(--wsc-font-bn);
  color:var(--wsc-muted);
  background:var(--wsc-surface-soft);
  font-size:var(--wsc-text-xs);
  font-weight:800;
}

.flatpickr-days,
.dayContainer{
  background:var(--wsc-surface);
}

.flatpickr-day{
  color:var(--wsc-text);
  border-color:transparent;
  font-family:var(--wsc-font-bn);
  font-size:var(--wsc-text-sm);
}

.flatpickr-day:hover,
.flatpickr-day:focus{
  color:var(--wsc-primary);
  background:var(--wsc-surface-soft);
  border-color:var(--wsc-border);
}

.flatpickr-day.today{
  color:var(--wsc-primary);
  border-color:var(--wsc-primary);
}

.flatpickr-day.today:hover,
.flatpickr-day.today:focus{
  color:#ffffff;
  background:var(--wsc-primary);
  border-color:var(--wsc-primary);
}

.flatpickr-day.selected,
.flatpickr-day.startRange,
.flatpickr-day.endRange,
.flatpickr-day.selected:hover,
.flatpickr-day.startRange:hover,
.flatpickr-day.endRange:hover{
  color:#ffffff;
  background:var(--wsc-primary);
  border-color:var(--wsc-primary);
}

.flatpickr-day.prevMonthDay,
.flatpickr-day.nextMonthDay,
.flatpickr-day.disabled,
.flatpickr-day.disabled:hover{
  color:var(--wsc-muted);
  background:transparent;
  border-color:transparent;
  opacity:0.55;
}

.flatpickr-day.flatpickr-disabled,
.flatpickr-day.flatpickr-disabled:hover{
  color:var(--wsc-muted);
  background:transparent;
  cursor:not-allowed;
  opacity:0.45;
}

.numInputWrapper span.arrowUp:after{
  border-bottom-color:var(--wsc-text);
}

.numInputWrapper span.arrowDown:after{
  border-top-color:var(--wsc-text);
}

/* 3-কলাম লেআউট (ডেস্কটপ) */
.form-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px 25px;
  align-items:start;
}

.full-width{
  grid-column:span 3;
}

@media(max-width:900px){
  .form-grid{
    grid-template-columns:repeat(2,1fr);
    gap:15px;
  }

  .full-width{
    grid-column:span 2;
  }
}

@media(max-width:640px){
  .form-grid{
    grid-template-columns:1fr;
  }

  .full-width{
    grid-column:span 1;
  }

  .prottoyon{
    padding:20px;
    margin:20px;
    border-radius:var(--earn-radius-lg);
  }
}
</style>
<div class="prottoyon">
<h2>প্রত্যয়ন পত্র ফর্ম</h2>
<form id="certificateForm">
  <div class="form-grid">
    <div><label>তারিখ</label><input type="text" name="date" class="datepicker" placeholder="২২ মে ২০২৬" required></div>
    <div><label>নাম</label><input type="text" name="name" placeholder="ছাত্র/ছাত্রীর নাম" required></div>
    <div><label>পিতার নাম</label><input type="text" name="father-name" placeholder="পিতার নাম" required></div>
    <div><label>মাতার নাম</label><input type="text" name="mother-name" placeholder="মাতার নাম" required></div>
    <div><label>ঠিকানা</label><textarea name="address" placeholder="ঠিকানা" required></textarea></div>
    <div><label>ক্লাস</label><div class="custom-select" id="classSelect"></div></div>
    <div><label>লিঙ্গ</label><div class="custom-select" id="genderSelect"></div></div>
    <div><label>জন্মতারিখ</label><input type="text" name="date-of-birth" class="datepicker" placeholder="০১ জানুয়ারি ২০১০" required></div>
    <div class="full-width"><button class="btn" type="submit">PDF তৈরি করুন</button></div>
  </div>
  <div class="result"></div>
</form>
</div>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
const WEB_APP_URL="https://script.google.com/macros/s/AKfycbz87PYg8eHSsC1FfqY2PKNik7wAMcwOGciNI5hsr33RyBkd9zS548di4Ezq7J9FxKvL/exec";
const classes=['প্লে','নার্সারী','কেজি','১','২','৩','৪','৫'];
const genders=['ছাত্র','ছাত্রী'];
function createCustomSelect(id,array){
 const container=document.getElementById(id);
 const selected=document.createElement('div'); selected.className='select-selected'; selected.textContent='নির্বাচন করুন';
 container.appendChild(selected);
 const items=document.createElement('div'); items.className='select-items';
 array.forEach(v=>{const d=document.createElement('div'); d.textContent=v; d.addEventListener('click',()=>{selected.textContent=v; items.style.display='none';}); items.appendChild(d);});
 container.appendChild(items);
 selected.addEventListener('click',()=>{items.style.display=items.style.display==='block'?'none':'block';});
}
createCustomSelect('classSelect',classes);
createCustomSelect('genderSelect',genders);
flatpickr('.datepicker',{dateFormat:'d F Y',altInput:true,altFormat:'d F Y',locale:{firstDayOfWeek:1,weekdays:{shorthand:['রবি','সোম','মঙ্গল','বুধ','বৃহস্পতি','শুক্র','শনি'],longhand:['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার']},months:{shorthand:['জান','ফেব','মার্চ','এপ্রিল','মে','জুন','জুল','আগ','সেপ্ট','অক্টো','নভ','ডিস'],longhand:['জানুয়ারী','ফেব্রুয়ারী','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর']}}});
document.getElementById('certificateForm').addEventListener('submit',async e=>{
 e.preventDefault();
 const form=e.target;
 const data={};
 form.querySelectorAll('input,textarea').forEach(el=>{data[el.name]=el.value.replace(/[0-9]/g,d=>'০১২৩৪৫৬৭৮৯'[d])});
 data.class=document.getElementById('classSelect').querySelector('.select-selected').textContent;
 data.gender=document.getElementById('genderSelect').querySelector('.select-selected').textContent;
 data.template='certificate';
 const cb='cb_'+Date.now();
 window[cb]=(res)=>{
 const r=form.querySelector('.result'); r.style.display='block'; r.innerHTML='';
 if(res.success){r.className='result success'; r.innerHTML=`<a href='${res.viewUrl}' target='_blank'>View PDF</a> <a href='${res.downloadUrl}' target='_blank'>Download PDF</a> <a href='${res.downloadUrl}' target='_blank' onclick='window.print()'>Print PDF</a>`;}
 else{r.className='result error'; r.textContent=res.message;}
 delete window[cb];
};
 const script=document.createElement('script'); script.src=WEB_APP_URL+'?action=generate&callback='+cb+'&'+new URLSearchParams(data).toString(); document.body.appendChild(script);
});
</script>

  </main>
