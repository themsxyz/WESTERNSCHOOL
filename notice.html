  <script type="text/babel">
    const API_URL = "https://script.google.com/macros/s/AKfycbx5uyXdaP-dhKnCdicvsRcnF5cZe1N-iKyWKEcGFWAa4MQXFEDw1_Y8BTch_Dgd2VoPug/exec";

    const LOGO_URL = "https://res.cloudinary.com/do1dejkkk/image/upload/v1778605133/western_logo_hg9fji_1_vojrqz_1_zjiw5m.png";

    const STORAGE = {
      adminKey: "wsc_admin_notice_key",
      lastTab: "wsc_admin_last_tab"
    };

    function jsonpRequest(params) {
      return new Promise((resolve, reject) => {
        const callbackName = "wsc_admin_callback_" + Date.now() + "_" + Math.floor(Math.random() * 100000);

        params.callback = callbackName;

        const query = Object.keys(params)
          .filter(key => params[key] !== undefined && params[key] !== null)
          .map(key => encodeURIComponent(key) + "=" + encodeURIComponent(params[key]))
          .join("&");

        const separator = API_URL.includes("?") ? "&" : "?";
        const script = document.createElement("script");

        const timeout = setTimeout(() => {
          cleanup();
          reject(new Error("Request timeout. Apps Script deployment/access check করুন।"));
        }, 25000);

        window[callbackName] = data => {
          cleanup();
          resolve(data);
        };

        script.onerror = () => {
          cleanup();
          reject(new Error("Network/API error. Web App URL বা deployment check করুন।"));
        };

        function cleanup() {
          clearTimeout(timeout);
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        script.src = API_URL + separator + query;
        document.body.appendChild(script);
      });
    }

    function nowLocalInput() {
      const d = new Date();
      d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      return d.toISOString().slice(0, 16);
    }

    function formatDate(value) {
      if (!value) return "-";
      const d = new Date(value);
      if (isNaN(d.getTime())) return String(value);

      return d.toLocaleString("bn-BD", {
        year: "numeric",
        month: "short",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function safeText(value) {
      return String(value || "").trim();
    }

    function App() {
      const [adminKey, setAdminKey] = React.useState(localStorage.getItem(STORAGE.adminKey) || "");
      const [activeTab, setActiveTab] = React.useState(localStorage.getItem(STORAGE.lastTab) || "global");
      const [status, setStatus] = React.useState({ type: "", text: "" });
      const [loading, setLoading] = React.useState(false);

      const [globalNotice, setGlobalNotice] = React.useState("");
      const [globalDate, setGlobalDate] = React.useState(nowLocalInput());
      const [globalDuration, setGlobalDuration] = React.useState("24h");
      const [customDuration, setCustomDuration] = React.useState("");

      const [studentId, setStudentId] = React.useState("");
      const [studentMessage, setStudentMessage] = React.useState("");
      const [studentDate, setStudentDate] = React.useState(nowLocalInput());

      const [globalList, setGlobalList] = React.useState([]);
      const [individualList, setIndividualList] = React.useState([]);
      const [filterStudentId, setFilterStudentId] = React.useState("");

      React.useEffect(() => {
        localStorage.setItem(STORAGE.lastTab, activeTab);
      }, [activeTab]);

      function showStatus(type, text) {
        setStatus({ type, text });
        setTimeout(() => {
          setStatus({ type: "", text: "" });
        }, 6000);
      }

      function saveAdminKey() {
        if (!adminKey.trim()) {
          showStatus("error", "Admin key লিখুন। Backend_Settings sheet থেকে NOTICE_ADMIN_KEY copy করুন।");
          return;
        }

        localStorage.setItem(STORAGE.adminKey, adminKey.trim());
        showStatus("success", "Admin key saved হয়েছে।");
      }

      async function sendGlobalNotice(e) {
        e.preventDefault();

        if (!adminKey.trim()) {
          showStatus("error", "Admin key missing.");
          return;
        }

        if (!globalNotice.trim()) {
          showStatus("error", "Notice text লিখুন।");
          return;
        }

        const duration = customDuration.trim() || globalDuration;

        try {
          setLoading(true);
          showStatus("info", "সব student-এর জন্য notice পাঠানো হচ্ছে...");

          const res = await jsonpRequest({
            action: "addNotice",
            adminKey: adminKey.trim(),
            notice: globalNotice.trim(),
            date: globalDate,
            duration: duration,
            createdBy: "React Admin Website"
          });

          if (!res.success) {
            throw new Error(res.error || "Notice send failed.");
          }

          setGlobalNotice("");
          setGlobalDate(nowLocalInput());
          setGlobalDuration("24h");
          setCustomDuration("");

          showStatus("success", "Notice successfully সব student-এর জন্য পাঠানো হয়েছে।");
          loadGlobalNotices();
        } catch (err) {
          showStatus("error", err.message);
        } finally {
          setLoading(false);
        }
      }

      async function sendIndividualMessage(e) {
        e.preventDefault();

        if (!adminKey.trim()) {
          showStatus("error", "Admin key missing.");
          return;
        }

        if (!studentId.trim()) {
          showStatus("error", "Student ID লিখুন।");
          return;
        }

        if (!studentMessage.trim()) {
          showStatus("error", "Individual message লিখুন।");
          return;
        }

        try {
          setLoading(true);
          showStatus("info", "Individual message পাঠানো হচ্ছে...");

          const res = await jsonpRequest({
            action: "addIndividualNotice",
            adminKey: adminKey.trim(),
            studentId: studentId.trim(),
            notice: studentMessage.trim(),
            date: studentDate,
            createdBy: "React Admin Website"
          });

          if (!res.success) {
            throw new Error(res.error || "Individual message send failed.");
          }

          setStudentMessage("");
          setStudentDate(nowLocalInput());

          showStatus("success", "Individual message successfully পাঠানো হয়েছে। এই message শুধু ওই Student ID-এর profile/message-এ show হবে।");
          loadIndividualMessages();
        } catch (err) {
          showStatus("error", err.message);
        } finally {
          setLoading(false);
        }
      }

      async function loadGlobalNotices() {
        if (!adminKey.trim()) {
          showStatus("error", "Admin key missing.");
          return;
        }

        try {
          setLoading(true);

          const res = await jsonpRequest({
            action: "adminNotices",
            adminKey: adminKey.trim()
          });

          if (!res.success) {
            throw new Error(res.error || "Notice list load failed.");
          }

          setGlobalList(res.notices || []);
          showStatus("success", "Global notice list loaded.");
        } catch (err) {
          showStatus("error", err.message);
        } finally {
          setLoading(false);
        }
      }

      async function loadIndividualMessages() {
        if (!adminKey.trim()) {
          showStatus("error", "Admin key missing.");
          return;
        }

        try {
          setLoading(true);

          const params = {
            action: "adminIndividualNotices",
            adminKey: adminKey.trim()
          };

          if (filterStudentId.trim()) {
            params.studentId = filterStudentId.trim();
          }

          const res = await jsonpRequest(params);

          if (!res.success) {
            throw new Error(res.error || "Individual message list load failed.");
          }

          setIndividualList(res.messages || res.notices || []);
          showStatus("success", "Individual message list loaded.");
        } catch (err) {
          showStatus("error", err.message);
        } finally {
          setLoading(false);
        }
      }

      async function deleteGlobalNotice(noticeId) {
        if (!confirm("এই notice delete করতে চান?")) return;

        try {
          setLoading(true);

          const res = await jsonpRequest({
            action: "deleteNotice",
            adminKey: adminKey.trim(),
            noticeId
          });

          if (!res.success) {
            throw new Error(res.error || "Delete failed.");
          }

          showStatus("success", "Notice deleted হয়েছে।");
          loadGlobalNotices();
        } catch (err) {
          showStatus("error", err.message);
        } finally {
          setLoading(false);
        }
      }

      async function deleteIndividualMessage(messageId) {
        if (!confirm("এই individual message delete করতে চান?")) return;

        try {
          setLoading(true);

          const res = await jsonpRequest({
            action: "deleteIndividualNotice",
            adminKey: adminKey.trim(),
            messageId
          });

          if (!res.success) {
            throw new Error(res.error || "Delete failed.");
          }

          showStatus("success", "Individual message deleted হয়েছে।");
          loadIndividualMessages();
        } catch (err) {
          showStatus("error", err.message);
        } finally {
          setLoading(false);
        }
      }

      async function editGlobalNotice(item) {
        const newText = prompt("Notice edit করুন:", item.notice || "");

        if (newText === null) return;

        const newDuration = prompt("Duration দিন: 30m, 2h, 24h, 3d, 7d, permanent", item.noticeAppearDuration || "24h");

        if (newDuration === null) return;

        try {
          setLoading(true);

          const res = await jsonpRequest({
            action: "editNotice",
            adminKey: adminKey.trim(),
            noticeId: item.noticeId,
            notice: newText,
            duration: newDuration,
            status: "Active"
          });

          if (!res.success) {
            throw new Error(res.error || "Edit failed.");
          }

          showStatus("success", "Notice updated হয়েছে।");
          loadGlobalNotices();
        } catch (err) {
          showStatus("error", err.message);
        } finally {
          setLoading(false);
        }
      }

      async function editIndividualMessage(item) {
        const newStudentId = prompt("Student ID edit করুন:", item.studentId || "");

        if (newStudentId === null) return;

        const newText = prompt("Message edit করুন:", item.message || item.notice || "");

        if (newText === null) return;

        try {
          setLoading(true);

          const res = await jsonpRequest({
            action: "editIndividualNotice",
            adminKey: adminKey.trim(),
            messageId: item.messageId || item.noticeId,
            studentId: newStudentId,
            notice: newText,
            status: "Active"
          });

          if (!res.success) {
            throw new Error(res.error || "Edit failed.");
          }

          showStatus("success", "Individual message updated হয়েছে।");
          loadIndividualMessages();
        } catch (err) {
          showStatus("error", err.message);
        } finally {
          setLoading(false);
        }
      }

      async function extendGlobalNotice(item) {
        const extraDuration = prompt("কত সময় বাড়াবেন? Example: 1h, 24h, 3d, 1w", "24h");

        if (!extraDuration) return;

        try {
          setLoading(true);

          const res = await jsonpRequest({
            action: "extendNoticeDuration",
            adminKey: adminKey.trim(),
            noticeId: item.noticeId,
            extraDuration
          });

          if (!res.success) {
            throw new Error(res.error || "Extend failed.");
          }

          showStatus("success", "Notice duration বাড়ানো হয়েছে।");
          loadGlobalNotices();
        } catch (err) {
          showStatus("error", err.message);
        } finally {
          setLoading(false);
        }
      }

      return (
        <div className="wsc-notice-admin">
          <div className="wsc-notice-admin__app">
            <header className="wsc-notice-admin__topbar">
              <div className="wsc-notice-admin__brand">
                <img className="wsc-notice-admin__logo" src={LOGO_URL} alt="Logo" />
                <div>
                  <h1 className="wsc-notice-admin__brand-title">Student Portal Admin</h1>
                  <p className="wsc-notice-admin__brand-subtitle">Notice & Individual Message Management</p>
                </div>
              </div>
              <span className="wsc-notice-admin__pill">
                <i className="fa-solid fa-cloud"></i>
                Apps Script Connected
              </span>
            </header>

            <div className={status.text ? `wsc-notice-admin__msg show ${status.type}` : "wsc-notice-admin__msg"}>
              {status.text}
            </div>

            <div className="wsc-notice-admin__grid">
              <aside className="wsc-notice-admin__card">
                <div className="wsc-notice-admin__card-head">
                  <h2 className="wsc-notice-admin__card-title"><i className="fa-solid fa-key"></i> Admin Access</h2>
                </div>

                <div className="wsc-notice-admin__card-body">
                  <div className="wsc-notice-admin__field">
                    <label className="wsc-notice-admin__field-label">Admin Key / NOTICE_ADMIN_KEY</label>
                    <input
                      className="wsc-notice-admin__input"
                      type="password"
                      value={adminKey}
                      onChange={e => setAdminKey(e.target.value)}
                      placeholder="Backend_Settings sheet থেকে key দিন"
                    />
                  </div>

                  <button className="wsc-notice-admin__btn wsc-notice-admin__btn--main wsc-notice-admin__btn--full" onClick={saveAdminKey}>
                    <i className="fa-solid fa-floppy-disk"></i>
                    Save Admin Key
                  </button>

                  <div className="wsc-notice-admin__spacer"></div>

                  <div className="wsc-notice-admin__help">
                    <strong>কাজের নিয়ম:</strong><br />
                    Notice দিলে সব student profile/notice page-এ show হবে।<br />
                    Individual message দিলে শুধু ওই Student ID-এর message/profile-এ show হবে।
                  </div>

                  <div className="wsc-notice-admin__spacer"></div>

                  <button className="wsc-notice-admin__btn wsc-notice-admin__btn--soft wsc-notice-admin__btn--full" onClick={() => window.open(API_URL + "?action=health", "_blank")}>
                    <i className="fa-solid fa-heart-pulse"></i>
                    Test Backend Health
                  </button>
                </div>
              </aside>

              <main className="wsc-notice-admin__card">
                <div className="wsc-notice-admin__card-head">
                  <h2 className="wsc-notice-admin__card-title"><i className="fa-solid fa-screwdriver-wrench"></i> Manage Panel</h2>
                  {loading && <span className="wsc-notice-admin__pill wsc-notice-admin__pill--loading">
                    <i className="fa-solid fa-spinner fa-spin"></i> Working...
                  </span>}
                </div>

                <div className="wsc-notice-admin__card-body">
                  <div className="wsc-notice-admin__tabs">
                    <button className={activeTab === "global" ? "wsc-notice-admin__tab is-active" : "wsc-notice-admin__tab"} onClick={() => setActiveTab("global")}>
                      <i className="fa-solid fa-bullhorn"></i> All Student Notice
                    </button>
                    <button className={activeTab === "individual" ? "wsc-notice-admin__tab is-active" : "wsc-notice-admin__tab"} onClick={() => setActiveTab("individual")}>
                      <i className="fa-solid fa-envelope"></i> Individual Message
                    </button>
                    <button className={activeTab === "manageGlobal" ? "wsc-notice-admin__tab is-active" : "wsc-notice-admin__tab"} onClick={() => setActiveTab("manageGlobal")}>
                      <i className="fa-solid fa-list"></i> Notice List
                    </button>
                    <button className={activeTab === "manageIndividual" ? "wsc-notice-admin__tab is-active" : "wsc-notice-admin__tab"} onClick={() => setActiveTab("manageIndividual")}>
                      <i className="fa-solid fa-inbox"></i> Message List
                    </button>
                  </div>

                  {activeTab === "global" && (
                    <form onSubmit={sendGlobalNotice}>
                      <div className="wsc-notice-admin__field">
                        <label className="wsc-notice-admin__field-label">সব student-এর জন্য Notice লিখুন</label>
                        <textarea
                          className="wsc-notice-admin__textarea"
                          value={globalNotice}
                          onChange={e => setGlobalNotice(e.target.value)}
                          placeholder="যেমন: আগামীকাল স্কুল বন্ধ থাকবে..."
                        />
                      </div>

                      <div className="wsc-notice-admin__two">
                        <div className="wsc-notice-admin__field">
                          <label className="wsc-notice-admin__field-label">Notice Start Date/Time</label>
                          <input
                            className="wsc-notice-admin__input"
                            type="datetime-local"
                            value={globalDate}
                            onChange={e => setGlobalDate(e.target.value)}
                          />
                        </div>

                        <div className="wsc-notice-admin__field">
                          <label className="wsc-notice-admin__field-label">Notice Duration</label>
                          <select className="wsc-notice-admin__select" value={globalDuration} onChange={e => setGlobalDuration(e.target.value)}>
                            <option value="30m">30 Minutes</option>
                            <option value="1h">1 Hour</option>
                            <option value="2h">2 Hours</option>
                            <option value="6h">6 Hours</option>
                            <option value="12h">12 Hours</option>
                            <option value="24h">24 Hours</option>
                            <option value="3d">3 Days</option>
                            <option value="7d">7 Days</option>
                            <option value="30d">30 Days</option>
                            <option value="permanent">Permanent</option>
                          </select>
                        </div>
                      </div>

                      <div className="wsc-notice-admin__field">
                        <label className="wsc-notice-admin__field-label">Custom Duration Optional</label>
                        <input
                          className="wsc-notice-admin__input"
                          type="text"
                          value={customDuration}
                          onChange={e => setCustomDuration(e.target.value)}
                          placeholder="Example: 45m, 5h, 10d, permanent"
                        />
                      </div>

                      <button className="wsc-notice-admin__btn wsc-notice-admin__btn--gold wsc-notice-admin__btn--full" disabled={loading}>
                        <i className="fa-solid fa-paper-plane"></i>
                        Notice Upload / Send to All Students
                      </button>
                    </form>
                  )}

                  {activeTab === "individual" && (
                    <form onSubmit={sendIndividualMessage}>
                      <div className="wsc-notice-admin__field">
                        <label className="wsc-notice-admin__field-label">Student ID</label>
                        <input
                          className="wsc-notice-admin__input"
                          type="text"
                          inputMode="numeric"
                          value={studentId}
                          onChange={e => setStudentId(e.target.value.replace(/\D/g, ""))}
                          placeholder="যেমন: 100111"
                        />
                      </div>

                      <div className="wsc-notice-admin__field">
                        <label className="wsc-notice-admin__field-label">Individual Message লিখুন</label>
                        <textarea
                          className="wsc-notice-admin__textarea"
                          value={studentMessage}
                          onChange={e => setStudentMessage(e.target.value)}
                          placeholder="এই message শুধু উপরের Student ID-এর portal/profile/message-এ show হবে..."
                        />
                      </div>

                      <div className="wsc-notice-admin__field">
                        <label className="wsc-notice-admin__field-label">Message Date/Time</label>
                        <input
                          className="wsc-notice-admin__input"
                          type="datetime-local"
                          value={studentDate}
                          onChange={e => setStudentDate(e.target.value)}
                        />
                      </div>

                      <button className="wsc-notice-admin__btn wsc-notice-admin__btn--purple wsc-notice-admin__btn--full" disabled={loading}>
                        <i className="fa-solid fa-envelope-circle-check"></i>
                        Send Individual Message
                      </button>
                    </form>
                  )}

                  {activeTab === "manageGlobal" && (
                    <div>
                      <button className="wsc-notice-admin__btn wsc-notice-admin__btn--blue" onClick={loadGlobalNotices} disabled={loading}>
                        <i className="fa-solid fa-rotate"></i>
                        Load All Notices
                      </button>

                      <div className="wsc-notice-admin__spacer"></div>

                      <div className="wsc-notice-admin__notice-list">
                        {globalList.length ? globalList.map(item => (
                          <article className="wsc-notice-admin__notice-item global" key={item.noticeId}>
                            <div className="wsc-notice-admin__notice-top">
                              <h3 className="wsc-notice-admin__notice-title">
                                <i className="fa-solid fa-bullhorn"></i>
                                Global Notice
                              </h3>
                              <strong>{item.status || "Active"}</strong>
                            </div>

                            <p className="wsc-notice-admin__notice-text">{item.notice}</p>

                            <div className="wsc-notice-admin__meta">
                              <span><i className="fa-solid fa-hashtag"></i>{item.noticeId}</span>
                              <span><i className="fa-solid fa-calendar"></i>{formatDate(item.date)}</span>
                              <span><i className="fa-solid fa-clock"></i>{item.noticeAppearDuration || "-"}</span>
                              <span><i className="fa-solid fa-hourglass-end"></i>{item.expireAt ? formatDate(item.expireAt) : "Permanent"}</span>
                            </div>

                            <div className="wsc-notice-admin__actions">
                              <button className="wsc-notice-admin__btn wsc-notice-admin__btn--blue wsc-notice-admin__small-btn" onClick={() => editGlobalNotice(item)}>
                                <i className="fa-solid fa-pen"></i> Edit
                              </button>
                              <button className="wsc-notice-admin__btn wsc-notice-admin__btn--gold wsc-notice-admin__small-btn" onClick={() => extendGlobalNotice(item)}>
                                <i className="fa-solid fa-clock"></i> Extend
                              </button>
                              <button className="wsc-notice-admin__btn wsc-notice-admin__btn--danger wsc-notice-admin__small-btn" onClick={() => deleteGlobalNotice(item.noticeId)}>
                                <i className="fa-solid fa-trash"></i> Delete
                              </button>
                            </div>
                          </article>
                        )) : (
                          <div className="wsc-notice-admin__empty">
                            <i className="fa-solid fa-bullhorn"></i>
                            Notice list empty. Load All Notices চাপুন।
                          </div>
                        )}
                      </div>
                    </div>
                  )}

                  {activeTab === "manageIndividual" && (
                    <div>
                      <div className="wsc-notice-admin__two">
                        <div className="wsc-notice-admin__field">
                          <label className="wsc-notice-admin__field-label">Filter by Student ID Optional</label>
                          <input
                            className="wsc-notice-admin__input"
                            type="text"
                            inputMode="numeric"
                            value={filterStudentId}
                            onChange={e => setFilterStudentId(e.target.value.replace(/\D/g, ""))}
                            placeholder="সব দেখতে empty রাখুন"
                          />
                        </div>

                        <div className="wsc-notice-admin__field">
                          <label className="wsc-notice-admin__field-label">&nbsp;</label>
                          <button className="wsc-notice-admin__btn wsc-notice-admin__btn--purple wsc-notice-admin__btn--full" onClick={loadIndividualMessages} disabled={loading}>
                            <i className="fa-solid fa-rotate"></i>
                            Load Messages
                          </button>
                        </div>
                      </div>

                      <div className="wsc-notice-admin__notice-list">
                        {individualList.length ? individualList.map(item => (
                          <article className="wsc-notice-admin__notice-item individual" key={item.messageId || item.noticeId}>
                            <div className="wsc-notice-admin__notice-top">
                              <h3 className="wsc-notice-admin__notice-title">
                                <i className="fa-solid fa-envelope"></i>
                                Individual Message
                              </h3>
                              <strong>Student ID: {item.studentId || "-"}</strong>
                            </div>

                            <p className="wsc-notice-admin__notice-text">{item.message || item.notice}</p>

                            <div className="wsc-notice-admin__meta">
                              <span><i className="fa-solid fa-hashtag"></i>{item.messageId || item.noticeId}</span>
                              <span><i className="fa-solid fa-calendar"></i>{formatDate(item.date)}</span>
                              <span><i className="fa-solid fa-circle-check"></i>{item.status || "Active"}</span>
                            </div>

                            <div className="wsc-notice-admin__actions">
                              <button className="wsc-notice-admin__btn wsc-notice-admin__btn--blue wsc-notice-admin__small-btn" onClick={() => editIndividualMessage(item)}>
                                <i className="fa-solid fa-pen"></i> Edit
                              </button>
                              <button className="wsc-notice-admin__btn wsc-notice-admin__btn--danger wsc-notice-admin__small-btn" onClick={() => deleteIndividualMessage(item.messageId || item.noticeId)}>
                                <i className="fa-solid fa-trash"></i> Delete
                              </button>
                            </div>
                          </article>
                        )) : (
                          <div className="wsc-notice-admin__empty">
                            <i className="fa-solid fa-inbox"></i>
                            Individual message list empty. Load Messages চাপুন।
                          </div>
                        )}
                      </div>
                    </div>
                  )}
                </div>
              </main>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>

  </main>

  <!-- JS files -->
  <script src="assets/js/wsc-config.js"></script>
  <script src="assets/js/wsc-layout.js"></script>
  <script src="assets/js/wsc-search.js"></script>
  <script src="assets/js/wsc-password.js"></script>
</body>
</html>
