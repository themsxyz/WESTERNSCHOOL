<body>
  <!-- Keep this blank. Add custom page content here later if needed. -->
  <main data-wsc-page-content>
    <style>
/* Uses your global :root variables. JS/functions are unchanged. */
.fee-body {
    --fee-primary: var(--wsc-primary, #2563eb);
    --fee-primary-dark: var(--wsc-primary-dark, #1d4ed8);
    --fee-success: var(--wsc-success, #16a34a);
    --fee-danger: var(--wsc-danger, #dc2626);
    --fee-warning: var(--warning, #b45309);
    --fee-gray-bg: var(--wsc-bg, #f6f9ff);
    --fee-card-white: var(--wsc-surface, #ffffff);
    --fee-card-soft: var(--wsc-surface-soft, #f1f5ff);
    --fee-text-dark: var(--wsc-text, #111827);
    --fee-text-light: var(--wsc-muted, #6b7280);
    --fee-border: var(--wsc-border, #dbe4f0);
    --fee-shadow: var(--wsc-shadow, 0 14px 40px rgba(15, 23, 42, 0.08));
    --fee-font-family: var(--wsc-font-bn, "Noto Sans Bengali", system-ui, sans-serif);
    --fee-radius-lg: var(--earn-radius-xl, 32px);
    --fee-radius-md: var(--earn-radius-lg, 24px);
    --fee-radius-sm: var(--earn-radius-md, 18px);
    --fee-radius-pill: var(--wsc-radius-pill, 999px);

    background: var(--fee-gray-bg);
    padding: 24px;
    color: var(--fee-text-dark);
    font-family: var(--fee-font-family);
    font-size: var(--wsc-text-base, 16px);
}

.fee-container {
    max-width: 1600px;
    margin: auto;
}

.fee-card {
    background: transparent;
    border-radius: var(--fee-radius-lg);
    padding: 0.7px;
    margin-bottom: 24px;
    color: var(--fee-text-dark);
}

.fee-h1 {
    font-size: clamp(var(--wsc-text-xl, 28px), 3vw, 38px);
    font-weight: 800;
    text-align: center;
    margin-bottom: 10px;
    letter-spacing: -0.5px;
    color: var(--fee-text-dark);
}

.fee-h2 {
    font-size: var(--wsc-text-lg, 22px);
    font-weight: 700;
    margin-bottom: 20px;
    color: var(--fee-text-dark);
}

.fee-subtitle {
    font-size: var(--wsc-text-sm, 14px);
    color: var(--fee-text-light);
}

.fee-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px;
}

.fee-input-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.fee-label {
    font-size: var(--wsc-text-sm, 14px);
    font-weight: 600;
    padding: 5px 6px;
    color: var(--fee-text-dark);
}

.fee-input,
.fee-select {
    width: 100%;
    box-sizing: border-box;
    padding: 15px 18px;
    border-radius: 50px;
    border: 1px solid var(--fee-border);
    background: var(--fee-card-white);
    color: var(--fee-text-dark);
    font-size: var(--wsc-text-base, 16px);
    outline: none;
    transition: border-color var(--wsc-transition, 180ms ease), box-shadow var(--wsc-transition, 180ms ease), background var(--wsc-transition, 180ms ease);
    font-family: var(--fee-font-family);
    caret-color: var(--fee-primary);
}

.fee-input::placeholder {
    color: var(--fee-text-light);
    opacity: 0.85;
}

.fee-input:focus,
.fee-select:focus {
    border-color: var(--fee-primary);
    box-shadow: 0 0 0 5px color-mix(in srgb, var(--fee-primary) 14%, transparent);
}

/* Important: auto-filled readonly values stay visible in light/dark mode */
.fee-input[readonly] {
    background: var(--fee-card-soft);
    color: var(--fee-text-dark) !important;
    -webkit-text-fill-color: var(--fee-text-dark) !important;
    cursor: default;
    opacity: 1;
}

/* Browser autofill protection */
.fee-input:-webkit-autofill,
.fee-input:-webkit-autofill:hover,
.fee-input:-webkit-autofill:focus,
.fee-select:-webkit-autofill,
.fee-select:-webkit-autofill:hover,
.fee-select:-webkit-autofill:focus {
    -webkit-text-fill-color: var(--fee-text-dark) !important;
    caret-color: var(--fee-primary);
    box-shadow: 0 0 0 1000px var(--fee-card-white) inset !important;
    transition: background-color 9999s ease-in-out 0s;
}

/* Custom dropdown: browser default select design removed */
.fee-custom-select {
    position: relative;
    width: 100%;
    max-width: 420px;
}

.fee-custom-select-trigger {
    width: 100%;
    box-sizing: border-box;
    padding: 15px 18px;
    border-radius: 50px;
    border: 1px solid var(--fee-border);
    background: var(--fee-card-white);
    color: var(--fee-text-dark);
    font-size: var(--wsc-text-base, 16px);
    font-family: var(--fee-font-family);
    font-weight: 700;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    transition: border-color var(--wsc-transition, 180ms ease), box-shadow var(--wsc-transition, 180ms ease), background var(--wsc-transition, 180ms ease);
}

.fee-custom-select-trigger:hover,
.fee-custom-select.open .fee-custom-select-trigger {
    border-color: var(--fee-primary);
    box-shadow: 0 0 0 5px color-mix(in srgb, var(--fee-primary) 12%, transparent);
}

.fee-custom-arrow {
    width: 28px;
    height: 28px;
    border-radius: var(--fee-radius-pill);
    background: var(--fee-card-soft);
    color: var(--fee-primary);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    transition: transform var(--wsc-transition, 180ms ease);
}

.fee-custom-select.open .fee-custom-arrow {
    transform: rotate(180deg);
}

.fee-custom-select-list {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    right: 0;
    z-index: 50;
    background: var(--fee-card-white);
    border: 1px solid var(--fee-border);
    border-radius: var(--wsc-radius-md, 14px);
    box-shadow: var(--fee-shadow);
    padding: 8px;
    display: none;
}

.fee-custom-select.open .fee-custom-select-list {
    display: block;
}

.fee-custom-option {
    width: 100%;
    border: 0;
    background: transparent;
    color: var(--fee-text-dark);
    padding: 12px 14px;
    border-radius: var(--wsc-radius-sm, 8px);
    font-size: var(--wsc-text-sm, 14px);
    font-family: var(--fee-font-family);
    font-weight: 700;
    text-align: left;
    cursor: pointer;
    transition: background var(--wsc-transition, 180ms ease), color var(--wsc-transition, 180ms ease);
}

.fee-custom-option:hover,
.fee-custom-option.active {
    background: var(--fee-card-soft);
    color: var(--fee-primary);
}

.fee-custom-option.active::after {
    content: "✓";
    float: right;
    color: var(--fee-success);
}

.fee-button {
    padding: 15px 24px;
    border: none;
    border-radius: var(--fee-radius-pill);
    background: var(--fee-primary);
    color: #ffffff;
    font-size: var(--wsc-text-sm, 14px);
    font-weight: 700;
    cursor: pointer;
    transition: background var(--wsc-transition, 180ms ease), transform var(--wsc-transition, 180ms ease);
    font-family: var(--fee-font-family);
}

.fee-button:hover {
    background: var(--fee-primary-dark);
    transform: translateY(-1px);
}

.fee-button:disabled {
    background: var(--fee-text-light);
    cursor: not-allowed;
    transform: none;
}

.fee-months {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
}

.fee-month-pill {
    position: relative;
}

.fee-month-pill input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
}

.fee-month-pill label {
    padding: 12px 18px;
    border-radius: var(--fee-radius-pill);
    background: var(--fee-card-white);
    color: var(--fee-text-dark);
    border: 1px solid var(--fee-border);
    cursor: pointer;
    font-size: var(--wsc-text-sm, 14px);
    font-weight: 600;
    transition: all var(--wsc-transition, 180ms ease);
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 74px;
}

.fee-month-pill input:checked + label {
    background: var(--fee-primary);
    color: #ffffff;
    border-color: var(--fee-primary);
}

.fee-month-card {
    margin-top: 20px;
    padding: 24px;
    border-radius: var(--fee-radius-md);
    background: var(--fee-card-soft);
    border: 1px solid var(--fee-border);
    color: var(--fee-text-dark);
}

.fee-month-card h3 {
    font-size: var(--wsc-text-md, 18px);
    margin-bottom: 20px;
    color: var(--fee-text-dark);
}

.fee-amount-preview {
    margin-top: 8px;
    font-size: var(--wsc-text-xs, 12px);
    font-weight: 700;
    color: var(--fee-primary);
}

.fee-success {
    background: var(--success-bg, #ecfdf3);
    color: var(--success, #166534);
    padding: 18px;
    border-radius: var(--fee-radius-sm);
    margin-top: 20px;
    font-size: var(--wsc-text-sm, 14px);
    font-weight: 700;
    display: none;
}

.fee-search-area {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
}

.fee-search-area input {
    flex: 1;
}

.fee-summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 18px;
    margin-top: 24px;
}

.fee-summary-box {
    padding: 24px;
    border-radius: var(--fee-radius-md);
    background: var(--fee-card-soft);
    border: 1px solid var(--fee-border);
    color: var(--fee-text-dark);
}

.fee-summary-box h3 {
    font-size: var(--wsc-text-sm, 14px);
    color: var(--fee-text-light);
    margin-bottom: 10px;
}

.fee-summary-box p {
    font-size: var(--wsc-text-xl, 28px);
    font-weight: 800;
    color: var(--fee-text-dark);
}

.fee-receipt-box {
    margin-top: 24px;
    padding: 24px;
    border-radius: var(--fee-radius-md);
    background: var(--fee-card-white);
    border: 1px solid var(--fee-border);
    color: var(--fee-text-dark);
}

.fee-receipt-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
}

.fee-badge {
    padding: 10px 18px;
    border-radius: var(--fee-radius-pill);
    background: var(--fee-card-soft);
    color: var(--fee-primary);
    font-size: var(--wsc-text-xs, 12px);
    font-weight: 700;
}

.fee-table-wrapper {
    overflow: auto;
    border-radius: var(--fee-radius-sm);
    border: 1px solid var(--fee-border);
}

.fee-table {
    width: 100%;
    border-collapse: collapse;
    background: var(--fee-card-white);
    color: var(--fee-text-dark);
}

.fee-table th {
    background: var(--fee-card-soft);
    color: var(--fee-text-dark);
    padding: 15px;
    font-size: var(--wsc-text-sm, 14px);
    text-align: center;
    white-space: nowrap;
}

.fee-table td {
    padding: 15px;
    text-align: center;
    font-size: var(--wsc-text-sm, 14px);
    border-top: 1px solid var(--fee-border);
    white-space: nowrap;
}

.fee-total-row {
    background: var(--fee-card-soft);
    font-weight: 800;
}

.fee-print-btn {
    padding: 10px 18px;
    border-radius: var(--fee-radius-pill);
    background: var(--fee-success);
    color: #ffffff;
    text-decoration: none;
    font-size: var(--wsc-text-xs, 12px);
    font-weight: 700;
    display: inline-block;
    transition: background var(--wsc-transition, 180ms ease), transform var(--wsc-transition, 180ms ease);
}

.fee-print-btn:hover {
    background: var(--fee-success);
    transform: translateY(-1px);
}

.fee-disabled-area {
    opacity: .55;
    pointer-events: none;
}

@media(max-width: 768px) {
    .fee-body {
        padding: 14px;
    }
    .fee-card {
        padding: 20px;
    }
    .fee-h1 {
        font-size: var(--wsc-text-xl, 28px);
    }
    .fee-search-area {
        flex-direction: column;
    }
}
</style>

<body class="fee-body">
<div class="fee-container">
    <!-- Header Card -->
    <div class="fee-card">
        <h1 class="fee-h1">ফি ম্যানেজমেন্ট</h1>
    </div>

    <!-- Student Information Card -->
    <div class="fee-card">
        <h2 class="fee-h2">👨‍🎓 শিক্ষার্থীর তথ্য</h2>
        <div class="fee-grid">
            <div class="fee-input-group">
                <label class="fee-label">স্টুডেন্ট আইডি (Student ID)</label>
                <input type="text" id="fee_student_id" class="fee-input" placeholder="Student ID লিখুন" oninput="clearTimeout(window.feeStudentTimer); window.feeStudentTimer = setTimeout(feeFetchStudent, 350)">
            </div>
            <div class="fee-input-group">
                <label class="fee-label">নাম (Name)</label>
                <input type="text" id="fee_student_name" class="fee-input" readonly>
            </div>
            <div class="fee-input-group">
                <label class="fee-label">রোল (Roll)</label>
                <input type="text" id="fee_roll" class="fee-input" readonly>
            </div>
            <div class="fee-input-group">
                <label class="fee-label">শ্রেণি (Class)</label>
                <input type="text" id="fee_class" class="fee-input" readonly>
            </div>
        </div>
    </div>

    <!-- Fee Selection Card -->
    <div class="fee-card fee-disabled-area" id="fee_feeSection">
        <h2 class="fee-h2">📅 মাস নির্বাচন করুন</h2>
        <div class="fee-months" id="fee_monthsContainer"></div>
        <br>
        <button class="fee-button" onclick="feeGenerateMonthInputs()">ফি ইনপুট তৈরি করুন</button>
        <div id="fee_monthInputs"></div>
    </div>

    <!-- Payment Section Card -->
    <div class="fee-card fee-disabled-area" id="fee_paymentSection">
        <h2 class="fee-h2">💳 পেমেন্ট মাধ্যম</h2>
        <input type="hidden" id="fee_payment_method" value="Cash">
        <div class="fee-custom-select" id="fee_payment_method_dropdown">
            <button type="button" class="fee-custom-select-trigger" onclick="feeToggleCustomDropdown('fee_payment_method_dropdown')">
                <span id="fee_payment_method_text">Cash</span>
                <span class="fee-custom-arrow">⌄</span>
            </button>
            <div class="fee-custom-select-list">
                <button type="button" class="fee-custom-option active" onclick="feeSelectCustomOption('fee_payment_method_dropdown', 'fee_payment_method', 'fee_payment_method_text', 'Cash', this)">Cash</button>
                <button type="button" class="fee-custom-option" onclick="feeSelectCustomOption('fee_payment_method_dropdown', 'fee_payment_method', 'fee_payment_method_text', 'Bkash', this)">Bkash</button>
                <button type="button" class="fee-custom-option" onclick="feeSelectCustomOption('fee_payment_method_dropdown', 'fee_payment_method', 'fee_payment_method_text', 'Nagad', this)">Nagad</button>
                <button type="button" class="fee-custom-option" onclick="feeSelectCustomOption('fee_payment_method_dropdown', 'fee_payment_method', 'fee_payment_method_text', 'Rocket', this)">Rocket</button>
                <button type="button" class="fee-custom-option" onclick="feeSelectCustomOption('fee_payment_method_dropdown', 'fee_payment_method', 'fee_payment_method_text', 'Bank', this)">Bank</button>
            </div>
        </div>
        <br><br>
        <button class="fee-button" onclick="feeSubmitFees()" id="fee_submitBtn" disabled>Receipt Generate করুন</button>
        <div class="fee-success" id="fee_successBox"></div>
    </div>

    <!-- Search & Reports Card -->
    <div class="fee-card">
        <h2 class="fee-h2">🔍 ফি অনুসন্ধান</h2>
        <div class="fee-search-area">
            <input type="text" id="fee_searchInput" class="fee-input" placeholder="Student ID / Receipt ID দিয়ে সার্চ করুন">
            <button class="fee-button" onclick="feeSearchData()">সার্চ করুন</button>
        </div>
        <div id="fee_summary"></div>
        <div id="fee_result"></div>
    </div>
</div>

<script>
    const FEE_API_URL = "https://script.google.com/macros/s/AKfycbxdqDiH48chrBATX0lD-F5di8jT08mXFURTI1DCh_iTB4edEaFP4f4mdj9Xipopx1gB/exec";
    const feeMonthsList = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

    // Initialize month pills
    document.getElementById("fee_monthsContainer").innerHTML = feeMonthsList.map(month => `
        <div class="fee-month-pill">
            <input type="checkbox" value="${month}" id="fee_${month}">
            <label for="fee_${month}">${month}</label>
        </div>
    `).join("");

    // Fetch student data by ID
    async function feeFetchStudent() {
        const studentId = document.getElementById("fee_student_id").value.trim();
        if (studentId.length < 1) {
            feeDisableSystem();
            return;
        }
        try {
            const response = await fetch(`${FEE_API_URL}?action=student&student_id=${studentId}`);
            const data = await response.json();
            if (data.error) {
                feeDisableSystem();
                return;
            }
            document.getElementById("fee_student_name").value = data.name || "";
            document.getElementById("fee_roll").value = data.roll || "";
            document.getElementById("fee_class").value = data.class || "";
            document.getElementById("fee_feeSection").classList.remove("fee-disabled-area");
            document.getElementById("fee_paymentSection").classList.remove("fee-disabled-area");
            document.getElementById("fee_submitBtn").disabled = false;
        } catch (err) {
            feeDisableSystem();
        }
    }

    function feeDisableSystem() {
        document.getElementById("fee_student_name").value = "";
        document.getElementById("fee_roll").value = "";
        document.getElementById("fee_class").value = "";
        document.getElementById("fee_feeSection").classList.add("fee-disabled-area");
        document.getElementById("fee_paymentSection").classList.add("fee-disabled-area");
        document.getElementById("fee_submitBtn").disabled = true;
    }

    function feeToggleCustomDropdown(dropdownId) {
        const dropdown = document.getElementById(dropdownId);
        document.querySelectorAll('.fee-custom-select').forEach(item => {
            if (item.id !== dropdownId) item.classList.remove('open');
        });
        dropdown.classList.toggle('open');
    }

    function feeSelectCustomOption(dropdownId, inputId, textId, value, optionElement) {
        document.getElementById(inputId).value = value;
        document.getElementById(textId).innerText = value;
        const dropdown = document.getElementById(dropdownId);
        dropdown.querySelectorAll('.fee-custom-option').forEach(option => option.classList.remove('active'));
        optionElement.classList.add('active');
        dropdown.classList.remove('open');
    }

    document.addEventListener('click', function(event) {
        if (!event.target.closest('.fee-custom-select')) {
            document.querySelectorAll('.fee-custom-select').forEach(item => item.classList.remove('open'));
        }
    });

    // Generate dynamic month input cards
    function feeGenerateMonthInputs() {
        const checkedMonths = [...document.querySelectorAll('.fee-month-pill input:checked')].map(el => el.value);
        let html = "";
        checkedMonths.forEach(month => {
            html += `
                <div class="fee-month-card">
                    <h3>📌 ${month}</h3>
                    <div class="fee-grid">
                        ${feeCreateAmountInput(month, "tuition", "Tuition Fee")}
                        ${feeCreateAmountInput(month, "admission", "Admission Fee")}
                        ${feeCreateAmountInput(month, "readmission", "Re Admission Fee")}
                        ${feeCreateAmountInput(month, "exam", "Exam Fee")}
                        ${feeCreateAmountInput(month, "computer", "Computer Fee")}
                        ${feeCreateAmountInput(month, "sports", "Sports Fee")}
                        ${feeCreateAmountInput(month, "tc", "TC Fee")}
                        ${feeCreateAmountInput(month, "misc", "Misc Fee")}
                    </div>
                </div>
            `;
        });
        document.getElementById("fee_monthInputs").innerHTML = html;
    }

    function feeCreateAmountInput(month, type, label) {
        return `
            <div>
                <input type="text" class="fee-input" placeholder="${label}" id="fee_${month}_${type}" oninput="feeFormatAmount(this)">
                <div class="fee-amount-preview" id="fee_${month}_${type}_preview"></div>
            </div>
        `;
    }

    function feeFormatAmount(input) {
        let value = input.value.replace(/,/g, '');
        value = value.replace(/\D/g, '');
        if (value === "") {
            input.value = "";
            feeUpdatePreview(input.id, "");
            return;
        }
        const number = parseInt(value);
        input.value = number.toLocaleString("en-IN");
        feeUpdatePreview(input.id, number.toLocaleString("bn-BD") + " টাকা");
    }

    function feeUpdatePreview(id, text) {
        const preview = document.getElementById(id + "_preview");
        if (preview) preview.innerHTML = text;
    }

    function feeCleanNumber(value) {
        if (!value) return "";
        return parseInt(value.toString().replace(/,/g, ''));
    }

    async function feeSubmitFees() {
        const checkedMonths = [...document.querySelectorAll('.fee-month-pill input:checked')].map(el => el.value);
        if (checkedMonths.length === 0) {
            alert("মাস নির্বাচন করুন");
            return;
        }
        const monthlyData = [];
        checkedMonths.forEach(month => {
            monthlyData.push({
                month: month,
                tuition_fee: feeCleanNumber(document.getElementById(`fee_${month}_tuition`).value),
                admission_fee: feeCleanNumber(document.getElementById(`fee_${month}_admission`).value),
                re_admission_fee: feeCleanNumber(document.getElementById(`fee_${month}_readmission`).value),
                exam_fee: feeCleanNumber(document.getElementById(`fee_${month}_exam`).value),
                computer_fee: feeCleanNumber(document.getElementById(`fee_${month}_computer`).value),
                sports_fee: feeCleanNumber(document.getElementById(`fee_${month}_sports`).value),
                tc_fee: feeCleanNumber(document.getElementById(`fee_${month}_tc`).value),
                misc_fee: feeCleanNumber(document.getElementById(`fee_${month}_misc`).value)
            });
        });
        const payload = {
            student_id: document.getElementById("fee_student_id").value,
            student_name: document.getElementById("fee_student_name").value,
            roll: document.getElementById("fee_roll").value,
            class: document.getElementById("fee_class").value,
            payment_method: document.getElementById("fee_payment_method").value,
            monthlyData: monthlyData
        };
        try {
            const response = await fetch(FEE_API_URL, { method: "POST", body: JSON.stringify(payload) });
            const result = await response.json();
            const successBox = document.getElementById("fee_successBox");
            successBox.style.display = "block";
            successBox.innerHTML = `✅ Receipt সফলভাবে তৈরি হয়েছে<br><br>Receipt No: <b>${result.receipt_id}</b><br><br>মোট টাকা: <b>${Number(result.total).toLocaleString("bn-BD")} ৳</b>`;
            if (result.pdf_link) window.open(result.pdf_link);
            // Reset form
            document.getElementById("fee_student_id").value = "";
            feeDisableSystem();
            document.getElementById("fee_monthInputs").innerHTML = "";
            document.getElementById("fee_payment_method").value = "Cash";
            document.getElementById("fee_payment_method_text").innerText = "Cash";
            document.querySelectorAll('#fee_payment_method_dropdown .fee-custom-option').forEach(option => option.classList.remove('active'));
            document.querySelector('#fee_payment_method_dropdown .fee-custom-option').classList.add('active');
            document.querySelectorAll('.fee-month-pill input').forEach(el => el.checked = false);
        } catch (err) {
            alert("সাবমিট ব্যর্থ, আবার চেষ্টা করুন");
        }
    }

    // Helper formatting functions
    function feeFormatDate(dateString) {
        if (!dateString) return "-";
        const date = new Date(dateString);
        if (isNaN(date)) return dateString;
        return date.toLocaleDateString("en-GB", { day: "2-digit", month: "long", year: "numeric" });
    }

    function feeFormatTime(timeString) {
        if (!timeString) return "-";
        if (timeString.includes("AM") || timeString.includes("PM")) return timeString;
        const date = new Date(timeString);
        if (isNaN(date)) return timeString;
        return date.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: true });
    }

    async function feeSearchData() {
        const searchValue = document.getElementById("fee_searchInput").value.trim();
        try {
            const response = await fetch(`${FEE_API_URL}?action=search&student_id=${searchValue}&receipt_id=${searchValue}`);
            const data = await response.json();
            const records = data.records || [];
            const grouped = {};
            records.forEach(item => {
                if (!grouped[item.receipt_id]) grouped[item.receipt_id] = [];
                grouped[item.receipt_id].push(item);
            });
            document.getElementById("fee_summary").innerHTML = `
                <div class="fee-summary">
                    <div class="fee-summary-box">
                        <h3>মোট Receipt</h3>
                        <p>${Number(Object.keys(grouped).length).toLocaleString("bn-BD")}</p>
                    </div>
                    <div class="fee-summary-box">
                        <h3>বার্ষিক মোট</h3>
                        <p>${Number(data.yearly_total || 0).toLocaleString("bn-BD")} ৳</p>
                    </div>
                </div>
            `;
            let html = "";
            for (const [receiptId, rows] of Object.entries(grouped)) {
                let receiptTotal = 0;
                html += `
                    <div class="fee-receipt-box">
                        <div class="fee-receipt-header">
                            <h2>📄 Receipt Details</h2>
                            <div class="fee-badge">${receiptId}</div>
                        </div>
                        <div class="fee-table-wrapper">
                            <table class="fee-table">
                                <thead>
                                    <tr>
                                        <th>মাস</th><th>Tuition</th><th>Admission</th><th>Exam</th>
                                        <th>Computer</th><th>Sports</th><th>Total</th><th>Date</th><th>সময়</th><th>Receipt</th>
                                    </tr>
                                </thead>
                                <tbody>
                `;
                rows.forEach(item => {
                    receiptTotal += Number(item.total || 0);
                    html += `
                        <tr>
                            <td>${item.month || ''}</td>
                            <td>${Number(item.tuition_fee || 0).toLocaleString("bn-BD")}</td>
                            <td>${Number(item.admission_fee || 0).toLocaleString("bn-BD")}</td>
                            <td>${Number(item.exam_fee || 0).toLocaleString("bn-BD")}</td>
                            <td>${Number(item.computer_fee || 0).toLocaleString("bn-BD")}</td>
                            <td>${Number(item.sports_fee || 0).toLocaleString("bn-BD")}</td>
                            <td>${Number(item.total || 0).toLocaleString("bn-BD")} ৳</td>
                            <td>${feeFormatDate(item.payment_date)}</td>
                            <td>${feeFormatTime(item.payment_time)}</td>
                            <td><a href="${item.pdf_link || '#'}" target="_blank" class="fee-print-btn">Print</a></td>
                        </tr>
                    `;
                });
                html += `
                                    <tr class="fee-total-row">
                                        <td colspan="6">মোট টাকা</td>
                                        <td colspan="1">${Number(receiptTotal).toLocaleString("bn-BD")} ৳</td>
                                        <td colspan="3"></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }
            document.getElementById("fee_result").innerHTML = html || "<div class='fee-card' style='margin-top:20px; text-align:center;'>কোনো রেকর্ড পাওয়া যায়নি</div>";
        } catch (err) {
            document.getElementById("fee_result").innerHTML = "<div class='fee-card' style='margin-top:20px; text-align:center;'>সার্চ করতে সমস্যা হয়েছে</div>";
        }
    }

    // Initial system state
    feeDisableSystem();
</script>
